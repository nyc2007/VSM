        const pc = data.production_control || { name: '生产计划部' };
        html += `<div class="pc-wrap" style="left:${pcX}px">
            <div class="pc-box"><div class="pc-header"><span class="vsm-edit-entity" data-entity="production_control" title="点击编辑名称">${esc(pc.name)}</span></div></div>
        </div>`;
        html += buildInfoFlowSvg(data, { totalW, pcX, supX, custX, uid });
        html += '</div></div>';

        const useGraphMaterial = data.hasBranching && data.graphLayout && data.graph;
        html += '<div class="vsm-zone material"><span class="zone-badge">物料流</span>';
        if (useGraphMaterial) {
            html += renderMaterialGraph(data, data.graphLayout, uid);
        } else {
            html += renderMaterialLinear(cols, widths, uid);
        }
        html += '</div>';

        const timelineW = useGraphMaterial ? data.graphLayout.totalW : totalW;
        html += '<div class="vsm-zone timeline"><span class="zone-badge">时间阶梯</span>';
        html += `<div class="timeline-track${useGraphMaterial ? ' graph-aligned' : ''}" style="width:${timelineW}px">`;
        html += `<svg id="ladder-svg" width="${timelineW}" height="72" aria-label="时间阶梯"></svg>`;
        html += '</div>';
        if (data.timeline_summary) {
            const t = data.timeline_summary;
            html += `<div class="timeline-summary">
                <strong>Production Lead Time: ${esc(t.production_lead_time || '')}</strong>
                <strong>Processing Time: ${esc(t.processing_time || '')}</strong>
                <strong>Value-Added Ratio: ${esc(t.value_added_ratio || '')}</strong>
            </div>`;
        }
        html += '</div></div>';

        lastLayout = {
            cols,
            widths,
            totalW,
            timelineW,
            uid,
            data,
            materialMode: useGraphMaterial ? 'graph' : 'linear',
            ladderMode: useGraphMaterial ? 'graph' : 'linear',
            graphLayout: data.graphLayout || null,
            criticalPath: data.criticalPath || null
        };
        return html;
    }

    function getRankProcessIds(layout, rank) {
        return Object.keys(layout).filter(
            (k) => !k.startsWith('__') && layout[k].rank === rank
        );
    }

    /** 工序加工时间上限（分钟），区间取 max 端 */
    function processCycleMaxMinutes(p) {
        const c = p?.timeline?.cycle ?? p?.data?.['C/T'] ?? '';
        const parsed = parseMinutesCell(String(c));
        if (parsed == null) return 0;
        if (typeof parsed === 'object') return parsed.max;
        return parsed;
    }

    /** 同一列（并行分支）取加工时间最大值，与物料流分叉语义一致 */
    function maxRankCycleLabel(data, layout, rank) {
        const ids = getRankProcessIds(layout, rank);
        if (!ids.length) return '';
        const maxMin = Math.max(0, ...ids.map((id) => processCycleMaxMinutes(data.processById[id])));
        return maxMin > 0 ? minutesToDuration(maxMin) : '';
    }

    /** 同一列并行工序的入边等待取最大值 */
    function maxRankIncomingWaitLabel(data, layout, rank) {
        const ids = getRankProcessIds(layout, rank);
        if (!ids.length) return '';
        let maxWait = 0;
        ids.forEach((id) => {
            const edge = data.graph?.edges?.find((e) => e.to === id);
            maxWait = Math.max(maxWait, Number(edge?.wait) || 0);
        });
        const w = minutesToDuration(maxWait);
        return w && w !== '0' ? w : '';
    }

    function getIncomingWaitLabel(data, procId) {
        const edge = data.graph?.edges?.find((e) => e.to === procId);
        const w = minutesToDuration(edge?.wait);
        return w && w !== '0' ? w : '';
    }

    /** 步骤 4：时间阶梯沿关键路径，列宽与 graphLayout 对齐（上=等待/link列，下=加工/工序列） */
    function drawGraphLadder() {
        const L = lastLayout;
        const layout = L.graphLayout?.layout;
        const path = L.criticalPath || [];
        const svg = document.getElementById('ladder-svg');
        if (!svg || !layout) return;

        const HIGH = 12;
        const LOW = 44;
        const LABEL_ABOVE = 6; /* 标注均在对应阶梯线段上侧 */
        const procIds = path.filter((id) => id !== '__INBOUND__' && id !== '__OUTBOUND__');
        if (!procIds.length) return;

        const truckW = LAYOUT.truck;
        const outX = layout.__OUTBOUND__?.xLeft ?? (L.graphLayout.totalW - truckW);
        const texts = [];
        const drawnRanks = new Set();

        let x = 0;
        let y = LOW;
        let d = `M 0 ${LOW} L ${truckW} ${LOW}`;
        x = truckW;

        procIds.forEach((id) => {
            const pos = layout[id];
            if (!pos) return;

            const linkStart = x;
            const rank = pos.rank;
            const rankIds = getRankProcessIds(layout, rank);
            const isParallelRank = rankIds.length > 1;

            if (y !== HIGH) {
                d += ` L ${x} ${HIGH}`;
                y = HIGH;
            }

            d += ` L ${pos.xLeft} ${HIGH}`;
            const wait = isParallelRank
                ? maxRankIncomingWaitLabel(L.data, layout, rank)
                : getIncomingWaitLabel(L.data, id);
            if (wait) {
                texts.push({ x: (linkStart + pos.xLeft) / 2, y: HIGH - LABEL_ABOVE, t: wait, fill: '#c62828' });
            }

            d += ` L ${pos.xLeft} ${LOW}`;
            y = LOW;
            d += ` L ${pos.xRight} ${LOW}`;

            if (!drawnRanks.has(rank)) {
                drawnRanks.add(rank);
                const cycle = isParallelRank
                    ? maxRankCycleLabel(L.data, layout, rank)
                    : (L.data.processById[id]?.timeline?.cycle ?? '');
                if (cycle) {
                    texts.push({ x: pos.xCenter, y: LOW - LABEL_ABOVE, t: cycle, fill: '#2e7d32' });
                }
            }

            x = pos.xRight;
        });

        if (y !== LOW) {
            d += ` L ${x} ${LOW}`;
        }
        d += ` L ${outX} ${LOW}`;

        let inner = `<path d="${d}" fill="none" stroke="#000" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter"/>`;
        texts.forEach(({ x, y, t, fill }) => {
            inner += `<text x="${x}" y="${y}" font-size="12" font-weight="bold" fill="${fill}" text-anchor="middle">${esc(t)}</text>`;
        });
        svg.innerHTML = inner;
    }

    /** PC → 外部：PC 侧边 → 水平路由 → 工厂顶边（箭头指向供应商/客户） */
    function pathPcToEntity(pcEdgeX, entX) {
        const ry = INFO.outLaneY;
        return `M ${pcEdgeX} ${ry} L ${entX} ${ry} L ${entX} ${INFO.entTopY}`;
    }

    /** 外部 → PC：工厂顶边 → 水平路由 → PC 侧边（箭头指向计划框） */
    function pathEntityToPc(entX, pcEdgeX) {
        const ry = INFO.inLaneY;
        return `M ${entX} ${INFO.entTopY} L ${entX} ${ry} L ${pcEdgeX} ${ry}`;
    }

    function shouldSkipInfoFlow(f) {
        const from = f.from === 'ERP' ? 'PC' : f.from;
        const to = f.to === 'ERP' ? 'PC' : f.to;
        if (f.content === '供货通知') return true;
        if (f.type === 'manual_info') return true;
        if (from === 'SUPPLIER' && to === 'INBOUND') return true;
        if (!['PC', 'CUSTOMER', 'SUPPLIER'].includes(from) || !['PC', 'CUSTOMER', 'SUPPLIER'].includes(to)) return true;
        if (from === to) return true;
        return false;
    }

    function buildInfoFlowSvg(data, { totalW, pcX, supX, custX, uid }) {
        const pcLeftX = pcX - INFO.pcHalfW;
        const pcRightX = pcX + INFO.pcHalfW;
        const markerId = `info-mk-${uid}`;
        const paths = [];
        (data.flows || []).forEach((f) => {
            if (shouldSkipInfoFlow(f)) return;
            const from = f.from === 'ERP' ? 'PC' : f.from;
            const to = f.to === 'ERP' ? 'PC' : f.to;
            let d = null;
            if (to === 'PC') {
                const fx = from === 'CUSTOMER' ? custX : supX;
                const edge = from === 'CUSTOMER' ? pcRightX : pcLeftX;
                d = pathEntityToPc(fx, edge);
            } else if (from === 'PC') {
                const tx = to === 'CUSTOMER' ? custX : supX;
                const edge = to === 'CUSTOMER' ? pcRightX : pcLeftX;
                d = pathPcToEntity(edge, tx);
            }
            if (d) paths.push(d);
        });

        let inner = `<defs>
            <marker id="${markerId}" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
                <polygon points="0 0,8 4,0 8" fill="#c62828"/>
            </marker>
        </defs>`;
        paths.forEach((d) => {
            inner += `<path d="${d}" fill="none" stroke="#c62828" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#${markerId})"/>`;
        });
        return `<svg class="info-flow-svg" width="${totalW}" height="${INFO.stageH}" viewBox="0 0 ${totalW} ${INFO.stageH}" aria-label="信息流">${inner}</svg>`;
    }

    function drawLadder() {
        const L = lastLayout;
        if (!L) return;
        if (L.ladderMode === 'graph') {
            drawGraphLadder();
            return;
        }
        const svg = document.getElementById('ladder-svg');
        if (!svg) return;

        const HIGH = 12;
        const LOW = 44;
        const LABEL_ABOVE = 6;
        const isInv = (c) => c.type === 'inventory' || c.type === 'fifo';

        let x = 0;
        let y = LOW;
        let d = `M ${x} ${y}`;
        const texts = [];

        L.cols.forEach((col, i) => {
            const w = L.widths[i];
            const cx = x + w / 2;
            const next = L.cols[i + 1];

            if (col.type === 'truck-in') {
                d += ` L ${x + w} ${y}`;
                if (next && isInv(next)) {
                    d += ` L ${x + w} ${HIGH}`;
                    y = HIGH;
                }
            } else if (isInv(col)) {
                if (y !== HIGH) {
                    d += ` L ${x} ${HIGH}`;
                    y = HIGH;
                }
                d += ` L ${x + w} ${HIGH}`;
                if (col.wait) texts.push({ x: cx, y: HIGH - LABEL_ABOVE, t: col.wait, fill: '#c62828' });
                if (next && next.type === 'process') {
                    d += ` L ${x + w} ${LOW}`;
                    y = LOW;
                }
            } else if (col.type === 'process') {
                if (y !== LOW) {
                    d += ` L ${x} ${LOW}`;
                    y = LOW;
                }
                d += ` L ${x + w} ${LOW}`;
                if (col.cycle) texts.push({ x: cx, y: LOW - LABEL_ABOVE, t: col.cycle, fill: '#2e7d32' });
                if (next && isInv(next)) {
                    d += ` L ${x + w} ${HIGH}`;
                    y = HIGH;
                }
            } else {
                d += ` L ${x + w} ${y}`;
            }
            x += w;
        });

        let inner = `<path d="${d}" fill="none" stroke="#000" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter"/>`;
        texts.forEach(({ x, y, t, fill }) => {
            inner += `<text x="${x}" y="${y}" font-size="12" font-weight="bold" fill="${fill}" text-anchor="middle">${esc(t)}</text>`;
        });
        svg.innerHTML = inner;
    }

    const SYMBOL_ROWS = [

            <polygon points="58,6 70,10 58,14" fill="#c62828"/></svg>` },

            <polygon points="60,8 70,12 60,16" fill="#333"/></svg>` },
        { cat: '物流活动', name: '运输/发运', meaning: '进货、送货（卡车图标）。', html: () => SVG.truck() },
        { cat: '拉动与排队', name: 'FIFO通道', meaning: '先进先出缓冲通道。', html: () => SVG.fifo() },
        { cat: '时间与指标', name: '时间阶梯', meaning: '上：等待时间（红）；下：加工时间（绿）；锯齿折线连接。', html: () => `
            <svg width="120" height="44" viewBox="0 0 120 44"><path d="M 4,32 L 24,32 L 24,10 L 44,10 L 44,32 L 64,32 L 64,10 L 84,10 L 84,32 L 116,32" fill="none" stroke="#000" stroke-width="2"/>
            <text x="34" y="8" font-size="9" fill="#c62828" font-weight="bold">等待</text>
            <text x="54" y="40" font-size="9" fill="#2e7d32" font-weight="bold">加工</text></svg>` }

    function renderSymbolSheet() {
        const rows = SYMBOL_ROWS.map(r => `<tr>
            <td>${esc(r.cat)}</td>
            <td>${esc(r.name)}</td>
            <td class="symbol-cell">${typeof r.html === 'function' ? r.html() : r.html}</td>
            <td>${esc(r.meaning)}</td>
        </tr>`).join('');
        return `<div class="symbol-sheet">
            <h2>二、VSM 元素初稿 — 标准符号表</h2>
            <p class="note">依据《VSM样例清单与元素初稿》。外部对象为工厂锯齿顶符号：供应商置于价值流左侧，客户置于右侧。</p>
            <table class="symbol-table">
                <thead><tr><th>类别</th><th>元素名称</th><th>符号示意</th><th>元素含义与作用</th></tr></thead>
                <tbody>${rows}</tbody>
            </table>
        </div>`;
    }

    /* ========== 图上 inline 编辑（工序 / 实体名称） ========== */

    const ENTITY_NAME_LABELS = {
        supplier: '供应商名称',
        customer: '客户名称',
        production_control: '生产计划部名称'
    };

    const ENTITY_DEFAULT_NAMES = {
        supplier: '供应商',
        customer: '客户',
        production_control: '生产计划部'
    };

    const FLOW_LABEL_NAMES = {
        inbound: '入库标签',
        outbound: '出库标签'
    };

    const FLOW_DEFAULT_LABELS = {
        inbound: '原材料入库',
        outbound: '成品发运'
    };

    let activeInlineEditor = null;
    let skipNextInlineBlur = false;

    function getEntityNameFromRaw(raw, entityKey) {
        const fallback = ENTITY_DEFAULT_NAMES[entityKey] || '';
        if (isMacroFormat(raw)) {
            return raw.macro_entities?.[entityKey]?.name || fallback;
        }
        return raw[entityKey]?.name || raw.macro_entities?.[entityKey]?.name || fallback;
    }

    function updateProcessNameInRaw(raw, processId, newName) {
        const trimmed = String(newName ?? '').trim();
        if (!trimmed) throw new Error('工序名称不能为空');
        const list = raw.processes;
        if (!Array.isArray(list) || !list.length) throw new Error('JSON 中无 processes');
        const proc = list.find((p) => p.id === processId);
        if (!proc) throw new Error(`未找到工序 ${processId}`);
        proc.name = trimmed;
        return raw;
    }

    function updateEntityNameInRaw(raw, entityKey, newName) {
        const trimmed = String(newName ?? '').trim();
        const label = ENTITY_NAME_LABELS[entityKey] || '名称';
        if (!trimmed) throw new Error(`${label}不能为空`);
        if (isMacroFormat(raw)) {
            if (!raw.macro_entities) raw.macro_entities = {};
            if (!raw.macro_entities[entityKey]) raw.macro_entities[entityKey] = {};
            raw.macro_entities[entityKey].name = trimmed;
        } else {
            if (!raw[entityKey]) raw[entityKey] = {};
            raw[entityKey].name = trimmed;
        }
        return raw;
    }

    function getFlowLabelFromRaw(raw, flowKey) {
        return raw[flowKey]?.label || FLOW_DEFAULT_LABELS[flowKey] || '';
    }

    function updateFlowLabelInRaw(raw, flowKey, newLabel) {
        const trimmed = String(newLabel ?? '').trim();
        const label = FLOW_LABEL_NAMES[flowKey] || '标签';
        if (!trimmed) throw new Error(`${label}不能为空`);
        if (!raw[flowKey]) raw[flowKey] = {};
        raw[flowKey].label = trimmed;
        return raw;
    }

    function findRawProcess(raw, processId) {
        const proc = (raw.processes || []).find((p) => p.id === processId);
        if (!proc) throw new Error(`未找到工序 ${processId}`);
        return proc;
    }

    function getProcessDataFieldFromRaw(raw, processId, fieldKey) {
        const proc = (raw.processes || []).find((p) => p.id === processId);
        if (!proc) return '';
        const tl = proc.timeline || {};
        const ie = proc.ie_data || {};
        switch (fieldKey) {
            case 'C/T':
                return minutesToDuration(tl.cycle_time_minutes) || '';
            case 'C/O':
                return minutesToDuration(tl.setup_time_minutes) || '0';
            case '稼动率':
                return ie.availability_rate != null
                    ? `${Math.round(Number(ie.availability_rate) * 100)}%`
                    : '';
            case '性能率':
                return ie.performance_rate != null
                    ? `${Math.round(Number(ie.performance_rate) * 100)}%`
                    : '';
            case '一次合格率':
                return ie.quality_yield != null
                    ? `${Math.round(Number(ie.quality_yield) * 100)}%`
                    : '';
            case 'OEE': {
                if (ie.availability_rate == null || ie.quality_yield == null) return '';
                const a = Number(ie.availability_rate);
                const q = Number(ie.quality_yield);
                const perf = ie.performance_rate != null ? Number(ie.performance_rate) : 1;
                if (!Number.isFinite(a) || !Number.isFinite(q) || !Number.isFinite(perf)) return '';
                return `${Math.round(a * perf * q * 100)}%`;
            }
            case '资源':
                return (proc.resources || []).join('、');
            case 'UAF活动':
                return proc.uaf_mapping?.operational_activity || '';
            case '瓶颈说明':
                return proc.bottleneck_reason || '';
            default:
                return proc.data?.[fieldKey] != null ? String(proc.data[fieldKey]) : '';
        }
    }

    function updateProcessDataFieldInRaw(raw, processId, fieldKey, newValue) {
        const trimmed = String(newValue ?? '').trim();
        const proc = findRawProcess(raw, processId);

        if (fieldKey === 'OEE') {
            throw new Error('OEE 由稼动率×性能率×合格率自动计算，请改这三项');
        }

        if (!isMacroFormat(raw) && !proc.timeline && !proc.ie_data && proc.data
            && !['C/T', 'C/O', '稼动率', '性能率', '一次合格率', '资源', 'UAF活动', '瓶颈说明'].includes(fieldKey)) {
            if (!trimmed) throw new Error(`${fieldKey}不能为空`);
            proc.data[fieldKey] = trimmed;
            return raw;
        }

        if (!proc.timeline) proc.timeline = {};
        if (!proc.ie_data) proc.ie_data = {};
        if (!proc.uaf_mapping) proc.uaf_mapping = {};

        switch (fieldKey) {
            case 'C/T': {
                if (!trimmed || trimmed === '—') throw new Error('C/T 不能为空');
                const parsed = parseMinutesCell(trimmed);
                if (parsed == null) throw new Error('C/T 格式无效，可用 4h、2d、960~1080 等');
                proc.timeline.cycle_time_minutes = parsed;
                break;
            }
            case 'C/O': {
                const parsed = parseMinutesCell(trimmed || '0');
                proc.timeline.setup_time_minutes = parsed ?? 0;
                break;
            }
            case '稼动率': {
                if (!trimmed) throw new Error('稼动率不能为空');
                const rate = parseRate(trimmed);
                if (rate == null) throw new Error('稼动率格式无效，如 85% 或 0.85');
                proc.ie_data.availability_rate = rate;
                break;
            }
            case '性能率': {
                if (!trimmed) {
                    delete proc.ie_data.performance_rate;
                    break;
                }
                const rate = parseRate(trimmed);
                if (rate == null) throw new Error('性能率格式无效，如 95% 或 0.95');
                proc.ie_data.performance_rate = rate;
                break;
            }
            case '一次合格率': {
                if (!trimmed) throw new Error('一次合格率不能为空');
                const rate = parseRate(trimmed);
                if (rate == null) throw new Error('一次合格率格式无效，如 99% 或 0.99');
                proc.ie_data.quality_yield = rate;
                break;
            }
            case '资源':
                proc.resources = trimmed
                    ? trimmed.split(/[,，;；|/\s、]+/).map((s) => s.trim()).filter(Boolean)
                    : [];
                break;
            case 'UAF活动': {
                if (!trimmed) throw new Error('UAF活动不能为空');
                proc.uaf_mapping.operational_activity = trimmed;
                break;
            }
            case '瓶颈说明':
                proc.bottleneck_reason = trimmed;
                if (trimmed) proc.is_bottleneck = true;
                break;
            default:
                if (isMacroFormat(raw)) throw new Error(`不支持编辑字段 ${fieldKey}`);
                if (!proc.data) proc.data = {};
                if (!trimmed) throw new Error(`${fieldKey}不能为空`);
                proc.data[fieldKey] = trimmed;
        }
        return raw;
    }

    function attachInlineEditorInput(input, onCommit, onCancel) {
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                input.blur();
            } else if (e.key === 'Escape') {
                e.preventDefault();
                skipNextInlineBlur = true;
                onCancel();
            }
        });
        input.addEventListener('blur', () => {
            if (skipNextInlineBlur) {
                skipNextInlineBlur = false;
                return;
            }
            onCommit();
        });
    }

    function beginInlineTextEdit(titleEl) {
        if (activeInlineEditor || currentTab !== 'map') return;

        const processId = titleEl.dataset.processId;
        const entityKey = titleEl.dataset.entity;
        const flowKey = titleEl.dataset.flow;
        const dataField = titleEl.dataset.field;
        const isProcessData = titleEl.classList.contains('vsm-edit-data') && dataField;
        if (!isProcessData && !processId && !entityKey && !flowKey) return;

        let raw;
        try {
            raw = JSON.parse(document.getElementById('json-input').value);
        } catch {
            return;
        }

        let currentValue = '';
        let ariaLabel = '';
        let editorKind = null;
        let editorKey = null;
        let editorField = null;

        if (isProcessData) {
            if (!processId) return;
            currentValue = getProcessDataFieldFromRaw(raw, processId, dataField);
            if (currentValue === '—') currentValue = '';
            ariaLabel = `${processId} ${dataField}`;
            editorKind = 'processData';
            editorKey = processId;
            editorField = dataField;
        } else if (processId && titleEl.classList.contains('vsm-edit-name')) {
            const proc = (raw.processes || []).find((p) => p.id === processId);
            if (!proc) return;
            currentValue = proc.name || processId;
            ariaLabel = '工序名称';
            editorKind = 'process';
            editorKey = processId;
        } else if (entityKey) {
            currentValue = getEntityNameFromRaw(raw, entityKey);
            ariaLabel = ENTITY_NAME_LABELS[entityKey] || '名称';
            editorKind = 'entity';
            editorKey = entityKey;
        } else {
            currentValue = getFlowLabelFromRaw(raw, flowKey);
            ariaLabel = FLOW_LABEL_NAMES[flowKey] || '标签';
            editorKind = 'flow';
            editorKey = flowKey;
        }

        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'vsm-edit-name-input';
        input.value = currentValue;
        input.setAttribute('aria-label', ariaLabel);

        activeInlineEditor = { kind: editorKind, key: editorKey, field: editorField, hostEl: titleEl, input };

        if (isProcessData) {
            titleEl.textContent = '';
            titleEl.appendChild(input);
        } else {
            titleEl.replaceWith(input);
        }
        input.focus();
        input.select();

        attachInlineEditorInput(
            input,
            () => finishInlineTextEdit(true),
            () => finishInlineTextEdit(false)
        );
    }

    function finishInlineTextEdit(save) {
        if (!activeInlineEditor) return;
        const { kind, key, field, input } = activeInlineEditor;
        activeInlineEditor = null;

        if (!save) {
            render();
            return;
        }

        const err = document.getElementById('error');
        try {
            const raw = JSON.parse(document.getElementById('json-input').value);
            if (kind === 'process') {
                updateProcessNameInRaw(raw, key, input.value);
            } else if (kind === 'processData') {
                updateProcessDataFieldInRaw(raw, key, field, input.value);
            } else if (kind === 'entity') {
                updateEntityNameInRaw(raw, key, input.value);
            } else {
                updateFlowLabelInRaw(raw, key, input.value);
            }
            document.getElementById('json-input').value = JSON.stringify(raw, null, 2);
            err.style.display = 'none';
            render();
        } catch (e) {
            err.textContent = e.message;
            err.style.display = 'block';
            render();
        }
    }

    function initMapInlineEdit() {
        document.getElementById('output').addEventListener('click', (e) => {
            const el = e.target.closest('.vsm-edit-name, .vsm-edit-entity, .vsm-edit-flow, .vsm-edit-data');
            if (!el) return;
            e.preventDefault();
            e.stopPropagation();
            beginInlineTextEdit(el);
        });
    }

    function durationToMinutes(val) {
        if (val == null || val === '') return null;
        if (typeof val === 'number' && Number.isFinite(val)) return val;
        const s = String(val).trim();
        if (!s || s === '—' || s === '-') return null;
        let m = s.match(/^(\d+(?:\.\d+)?)\s*天/);
        if (m) return parseFloat(m[1]) * 1440;
        m = s.match(/^(\d+(?:\.\d+)?)\s*小时/);
        if (m) return parseFloat(m[1]) * 60;
        m = s.match(/^(\d+(?:\.\d+)?)\s*h\b/i);
        if (m) return parseFloat(m[1]) * 60;
        m = s.match(/^(\d+(?:\.\d+)?)\s*分钟?/);
        if (m) return parseFloat(m[1]);
        m = s.match(/^(\d+(?:\.\d+)?)\s*min/i);
        if (m) return parseFloat(m[1]);
        if (/^\d+(\.\d+)?$/.test(s)) return parseFloat(s);
        return null;
    }

    function fmtMinutes(min) {
        if (min == null || !Number.isFinite(min)) return '—';
        if (Math.abs(min) >= 1440) return `${(min / 1440).toFixed(1)}天 (${Math.round(min)}分钟)`;
        if (Math.abs(min) >= 60) return `${(min / 60).toFixed(1)}小时 (${Math.round(min)}分钟)`;
        return `${Math.round(min * 10) / 10}分钟`;
    }

    function fmtPct(x) {
        if (x == null || !Number.isFinite(x)) return '—';
        return `${(x * 100).toFixed(1)}%`;
    }

    function metricMinutes(val) {
        if (val == null || val === '') return 0;
        if (typeof val === 'number' && Number.isFinite(val)) return Math.max(0, val);
        if (typeof val === 'object') {
            const a = Number(val.min);
            const b = Number(val.max);
            const lo = Number.isFinite(a) ? a : 0;
            const hi = Number.isFinite(b) ? b : lo;
            return Math.max(lo, hi);
        }
        const n = Number(val);
        if (Number.isFinite(n)) return Math.max(0, n);
        return durationToMinutes(val) || 0;
    }

    function computeVsmMetrics(raw, normalizedData) {
        const processes = Array.isArray(raw?.processes) ? raw.processes : [];
        const inboundWait = metricMinutes(raw?.inbound?.wait_time_minutes);

        // 与图底 timeline_summary 对齐：有分叉/合流时 PLT 只加关键路径，不把并行支线时间相加
        const branching = !!(normalizedData?.hasBranching
            || (processes.length && hasBranching(processes)));
        let criticalPath = Array.isArray(normalizedData?.criticalPath)
            ? normalizedData.criticalPath
            : null;
        if (branching && (!criticalPath || !criticalPath.length)) {
            criticalPath = pickCriticalPath(buildProcessGraph(processes), processes);
        }
        const criticalPathIds = (criticalPath || [])
            .filter((id) => id && id !== '__INBOUND__' && id !== '__OUTBOUND__');
        const onCriticalPath = new Set(criticalPathIds);

        const rows = processes.map((p, idx) => {
            const tl = p.timeline || {};
            const ie = p.ie_data || {};
            const ct = metricMinutes(tl.cycle_time_minutes);
            const co = metricMinutes(tl.setup_time_minutes);
            const wait = metricMinutes(tl.wait_time_minutes);
            const available = Number(ie.available_time_minutes);
            const uptime = ie.availability_rate != null ? Number(ie.availability_rate) : null;
            const yieldRate = ie.quality_yield != null ? Number(ie.quality_yield) : null;
            const performanceInput = ie.performance_rate != null ? Number(ie.performance_rate) : null;
            // 表内无性能率时默认按 1.0（无速度损失数据），OEE 仍可算
            const performanceAssumed = !(performanceInput != null && Number.isFinite(performanceInput));
            const performanceRate = performanceAssumed ? 1 : performanceInput;
            const operators = ie.operators != null ? Number(ie.operators) : null;
            const batchSize = ie.batch_size != null ? Number(ie.batch_size) : (p.batch_size != null ? Number(p.batch_size) : null);
            const dailyCapacity = (Number.isFinite(available) && available > 0 && ct > 0)
                ? available / ct
                : null;
            const actualDailyCapacity = (dailyCapacity != null && uptime != null)
                ? dailyCapacity * uptime
                : null;
            const batchProcessTime = (batchSize != null && batchSize > 0)
                ? batchSize * ct + co
                : null;
            const oee = (uptime != null && Number.isFinite(uptime)
                && yieldRate != null && Number.isFinite(yieldRate)
                && Number.isFinite(performanceRate))
                ? uptime * performanceRate * yieldRate
                : null;
            const rawCt = metricMinutes(tl.raw_process_minutes);
            const id = p.id || `P${idx + 1}`;
            // 标签在前端推导：JSON 只存业务数；录入 vs 计算、质量备注不写进文件
            const provenance = inferProcessProvenance(p, {
                hasCt: ct > 0,
                hasCo: co > 0,
                hasWait: wait > 0,
                hasAvailable: Number.isFinite(available),
                hasUptime: uptime != null,
                hasYield: yieldRate != null,
                hasPerformance: !performanceAssumed,
                hasBatch: batchSize != null,
                hasOperators: operators != null,
                hasRawCt: rawCt > 0
            });
            return {
                id,
                name: p.name || p.id || `工序${idx + 1}`,
                ct,
                co,
                wait,
                available: Number.isFinite(available) ? available : null,
                uptime,
                yieldRate,
                performanceRate,
                performanceAssumed,
                oee,
                operators,
                batchSize,
                dailyCapacity,
                actualDailyCapacity,
                batchProcessTime,
                isBottleneck: !!p.is_bottleneck,
                onCriticalPath: !branching || onCriticalPath.has(id),
                resources: Array.isArray(p.resources) ? p.resources.join('、') : (p.resources || ''),
                dataStatus: p.data_status || null,
                provenance
            };
        });

        const setupMin = rows.reduce((s, r) => s + (r.co || 0), 0);
        const pltRows = branching
            ? criticalPathIds.map((id) => rows.find((r) => r.id === id)).filter(Boolean)
            : rows;
        const processingMin = pltRows.reduce((s, r) => s + (r.ct || 0), 0);
        const waitMin = pltRows.reduce((s, r) => s + (r.wait || 0), 0);
        // inbound 常与首工序（关键路径起点）等待同源，仅在额外且不同时计入 PLT
        const firstWait = pltRows[0]?.wait || 0;
        const extraInbound = (inboundWait > 0 && Math.abs(inboundWait - firstWait) > 0.5)
            ? inboundWait
            : 0;
        const pltMin = waitMin + processingMin + extraInbound;
        const vaRatio = pltMin > 0 ? processingMin / pltMin : null;

        let rolledYield = null;
        if (rows.some((r) => r.yieldRate != null)) {
            rolledYield = rows.reduce((acc, r) => acc * (r.yieldRate != null ? r.yieldRate : 1), 1);
        }

        const demand = Number(raw?.customer_demand_per_day ?? raw?.value_stream_meta?.daily_demand);
        const availableGlobal = Number(raw?.available_time_minutes ?? raw?.value_stream_meta?.available_time_minutes);
        const taktMin = (Number.isFinite(availableGlobal) && availableGlobal > 0 && Number.isFinite(demand) && demand > 0)
            ? availableGlobal / demand
            : null;
        const metaBatch = raw?.value_stream_meta?.batch_size != null
            ? Number(raw.value_stream_meta.batch_size)
            : null;

        // 现场汇总质量备注（不依赖 JSON 内嵌 summary）
        const provenanceLegend = {
            input: '录入',
            derived: '计算'
        };

        // 损失贡献 Top：并行时只看关键路径上的工序，占比分母与 PLT 一致
        const rankRows = branching ? pltRows : rows;
        const waitTop = [...rankRows].sort((a, b) => b.wait - a.wait).slice(0, 5).filter((r) => r.wait > 0);
        const ctTop = [...rankRows].sort((a, b) => b.ct - a.ct).slice(0, 5).filter((r) => r.ct > 0);
        const bottleneck = rows.find((r) => r.isBottleneck)
            || (ctTop[0] ? ctTop[0] : null);

        const oeeRows = rows.filter((r) => r.oee != null && Number.isFinite(r.oee));
        const avgOee = oeeRows.length
            ? oeeRows.reduce((s, r) => s + r.oee, 0) / oeeRows.length
            : null;
        const minOeeRow = oeeRows.length
            ? [...oeeRows].sort((a, b) => a.oee - b.oee)[0]
            : null;

        const criticalPathLabel = criticalPathIds.length
            ? criticalPathIds.join(' → ')
            : null;

        return {
            processCount: rows.length,
            processingMin,
            waitMin,
            setupMin,
            inboundWaitMin: inboundWait || null,
            extraInboundMin: extraInbound || null,
            pltMin,
            vaRatio,
            pltUsesCriticalPath: branching && criticalPathIds.length > 0,
            criticalPathIds,
            criticalPathLabel,
            rolledYield,
            avgOee,
            minOeeRow,
            taktMin,
            taktNote: taktMin == null ? '当前无日需求，暂不计算 Takt' : null,
            dataNotes: null,
            metaBatch: Number.isFinite(metaBatch) ? metaBatch : null,
            demand: Number.isFinite(demand) ? demand : null,
            availableGlobal: Number.isFinite(availableGlobal) ? availableGlobal : null,
            waitTop,
            ctTop,
            bottleneck,
            rows,
            provenanceLegend,
            summaryLabels: {
                plt: fmtMinutes(pltMin),
                processing: fmtMinutes(processingMin),
                va: fmtPct(vaRatio)
            }
        };
    }

    /** 由工序业务字段推断 provenance（不读 JSON 内嵌说明） */
    function inferProcessProvenance(p, flags) {
        const status = String(p.data_status || '');
        const rowSim = status.includes('模拟') && !status.includes('已有');
        const rowMixed = status.includes('已有') && status.includes('模拟');
        const ctQ = flags.hasRawCt ? 'measured' : 'simulated';
        const ieQ = 'simulated';
        const waitQ = rowSim || rowMixed || !status ? 'simulated' : 'measured';
        const out = {};
        const put = (key, quality, note) => {
            out[key] = { source: 'input', quality, note };
        };
        if (flags.hasCt) put('cycle_time_minutes', ctQ, flags.hasRawCt ? '有工艺工时' : '无工艺工时，占位 C/T');
        if (flags.hasCo) put('setup_time_minutes', ieQ, '表内录入');
        if (flags.hasWait) put('wait_time_minutes', waitQ, '表内录入');
        if (flags.hasAvailable) put('available_time_minutes', ieQ, '表内录入');
        if (flags.hasUptime) put('availability_rate', ieQ, '表内录入');
        if (flags.hasYield) put('quality_yield', ieQ, '表内录入');
        if (flags.hasPerformance) put('performance_rate', ieQ, '表内录入');
        if (flags.hasBatch) put('batch_size', ieQ, '表内录入');
        if (flags.hasOperators) put('operators', ieQ, '表内录入');
        if (status) {
            out._row = {
                source: 'input',
                quality: rowSim ? 'simulated' : (rowMixed ? 'mixed' : 'measured'),
                note: status
            };
        }
        return out;
    }

    function toggleMetricsPanel(force) {
        const panel = document.getElementById('metrics-panel');
        const btn = document.getElementById('btn-metrics');
        if (!panel) return;
        metricsPanelOpen = typeof force === 'boolean' ? force : !metricsPanelOpen;
        panel.classList.toggle('open', metricsPanelOpen);
        if (btn) btn.classList.toggle('active-panel', metricsPanelOpen);
        if (metricsPanelOpen) refreshMetricsPanel();
    }

    function switchMetricsTab(tab) {
        metricsTab = tab;
        document.querySelectorAll('#metrics-tabs button').forEach((b) => {
            b.classList.toggle('active', b.dataset.tab === tab);
        });
        refreshMetricsPanel();
    }

    function refreshMetricsPanel() {
        const body = document.getElementById('metrics-panel-body');
        if (!body) return;
        if (!lastMetrics || !lastMacroRaw) {
            body.innerHTML = '<div class="metrics-empty">请先渲染价值流图，再查看关键参数。</div>';
            return;
        }
        const m = lastMetrics;
        if (metricsTab === 'overview') {
            body.innerHTML = renderMetricsOverview(m);
        } else if (metricsTab === 'process') {
            body.innerHTML = renderMetricsProcess(m);
        } else if (metricsTab === 'loss') {
            body.innerHTML = renderMetricsLoss(m);
        } else {
            body.innerHTML = renderMetricsFormulas(m);
        }
    }

    function qualityHint(quality) {
        if (!quality) return '';
        const map = {
            measured: '质量:实测',
            simulated: '质量:占位',
            mixed: '质量:混合'
        };
        const label = map[quality] || `质量:${quality}`;
        return `<span class="prov-quality" title="助教表数据状态备注，不影响录入/计算归属">${esc(label)}</span>`;
    }

    function provBadge(source, note, quality) {
        if (!source) return '';
        // 兼容旧 JSON：measured/simulated/mixed 视为录入
        let src = source;
        if (src === 'measured' || src === 'simulated' || src === 'mixed') {
            quality = quality || src;
            src = 'input';
        }
        const map = {
            input: ['录入', 'prov-input'],
            derived: ['计算', 'prov-derived']
        };
        const info = map[src] || ['录入', 'prov-input'];
        const titleParts = [];
        if (note) titleParts.push(note);
        if (quality) titleParts.push(`质量备注: ${quality}`);
        const title = titleParts.length ? ` title="${esc(titleParts.join(' | '))}"` : '';
        return `<span class="prov ${info[1]}"${title}>${info[0]}</span>${src === 'input' ? qualityHint(quality) : ''}`;
    }

    function provFrom(obj, field, fallbackSource, fallbackNote) {
        const p = obj && obj[field];
        if (p && p.source) return provBadge(p.source, p.note || fallbackNote, p.quality);
        if (fallbackSource) return provBadge(fallbackSource, fallbackNote);
        return '';
    }

    function renderProvenanceLegend(m) {
        const items = [
            ['input', '录入'],
            ['derived', '计算']
        ];
        return `<div class="prov-legend">${items.map(([src, shortLabel]) => `
            <span class="item">${provBadge(src)} <span>${esc(shortLabel)}</span></span>
        `).join('')}</div>`;
    }

    function renderMetricsOverview(m) {
        const bn = m.bottleneck
            ? `${esc(m.bottleneck.id)} ${esc(m.bottleneck.name)}（C/T ${fmtMinutes(m.bottleneck.ct)}）`
            : '—';
        const d = 'derived';
        const inp = 'input';
        const pltNote = m.pltUsesCriticalPath
            ? '关键路径 Σ等待 + ΣC/T（并行支线不重复加）'
            : 'Σ等待 + ΣC/T';
        const sumScope = m.pltUsesCriticalPath ? '关键路径工序' : '各工序';
        return `
            ${renderProvenanceLegend(m)}
            <h4>价值流总览指标</h4>
            <table class="metrics-kv">
                <tr><th>工序数</th><td>${m.processCount}</td></tr>
                ${m.pltUsesCriticalPath && m.criticalPathLabel ? `<tr><th>关键路径</th><td>${esc(m.criticalPathLabel)}${provBadge(d, '等待+C/T 最长路径')}</td></tr>` : ''}
                <tr class="highlight"><th>Production Lead Time</th><td>${esc(m.summaryLabels.plt)}${provBadge(d, pltNote)}<br><span class="hint">Σ等待 ${fmtMinutes(m.waitMin)}${m.extraInboundMin ? ` + 额外入库 ${fmtMinutes(m.extraInboundMin)}` : ''} + ΣC/T ${fmtMinutes(m.processingMin)}${m.pltUsesCriticalPath ? '（与图底时间阶梯一致）' : ''}</span></td></tr>
                <tr><th>Processing Time</th><td>${esc(m.summaryLabels.processing)}${provBadge(d, m.pltUsesCriticalPath ? '关键路径 ΣC/T' : 'ΣC/T')}</td></tr>
                <tr><th>等待时间合计</th><td>${fmtMinutes(m.waitMin)}${provBadge(d, `Σ${sumScope}等待`)}</td></tr>
                <tr><th>换型 C/O 合计</th><td>${fmtMinutes(m.setupMin)}${provBadge(d, 'Σ各工序 C/O（含并行支线）')}</td></tr>
                <tr class="highlight"><th>Value-Added Ratio</th><td>${esc(m.summaryLabels.va)}${provBadge(d, 'Processing ÷ PLT')}</td></tr>
                <tr><th>累计良品率</th><td>${fmtPct(m.rolledYield)}${provBadge(d, '各工序合格率连乘')}</td></tr>
                <tr class="highlight"><th>OEE（工序均值）</th><td>${fmtPct(m.avgOee)}${m.avgOee != null ? provBadge(d, '各工序 OEE 算术平均') : ''}<br><span class="hint">OEE = 可用率 × 性能率 × 质量率；无性能率时按 100%</span></td></tr>
                <tr><th>最低 OEE 工序</th><td>${m.minOeeRow
                    ? `${esc(m.minOeeRow.id)} ${esc(m.minOeeRow.name)}（${fmtPct(m.minOeeRow.oee)}）${provBadge(d, '各工序 OEE 取最小')}`
                    : '—'}</td></tr>
                <tr><th>批量 Batch</th><td>${m.metaBatch != null ? m.metaBatch + ' 件/批' : '—'}${provBadge(inp, '表内批量', 'simulated')}</td></tr>
                <tr><th>班次 Available</th><td>${m.availableGlobal != null ? fmtMinutes(m.availableGlobal) : '—'}${provBadge(inp, '班次可用时间', 'simulated')}</td></tr>
                <tr><th>客户节拍 Takt</th><td>${m.taktMin != null ? fmtMinutes(m.taktMin) + provBadge(d, 'Available ÷ 日需求') : '—'}</td></tr>
                <tr class="danger"><th>瓶颈工序</th><td>${bn}${provBadge(d, '按 C/T 最长或标记瓶颈')}</td></tr>
            </table>
        `;
    }

    function renderMetricsProcess(m) {
        const rows = m.rows.map((r) => {
            const pv = r.provenance || {};
            const cpTag = m.pltUsesCriticalPath
                ? (r.onCriticalPath
                    ? ' <span class="hint">·关键路径</span>'
                    : ' <span class="hint">·并行支线（不计入 PLT）</span>')
                : '';
            return `
            <tr class="${r.isBottleneck ? 'danger' : ''}">
                <td><strong>${esc(r.id)}</strong><br>${esc(r.name)}${cpTag}${provFrom(pv, '_row')}</td>
                <td>
                    C/T：${fmtMinutes(r.ct)}${provFrom(pv, 'cycle_time_minutes')}<br>
                    C/O：${fmtMinutes(r.co)}${provFrom(pv, 'setup_time_minutes')}<br>
                    等待：${fmtMinutes(r.wait)}${provFrom(pv, 'wait_time_minutes')}<br>
                    Available：${r.available != null ? fmtMinutes(r.available) : '—'}${provFrom(pv, 'available_time_minutes')}<br>
                    批量：${r.batchSize ?? '—'}${provFrom(pv, 'batch_size')}<br>
                    稼动率：${r.uptime != null ? fmtPct(r.uptime) : '—'}${provFrom(pv, 'availability_rate')}<br>
                    性能率：${fmtPct(r.performanceRate)}${r.performanceAssumed
                        ? provBadge('derived', '缺省 100%（表内无 performance_rate）')
                        : provFrom(pv, 'performance_rate')}<br>
                    合格率：${r.yieldRate != null ? fmtPct(r.yieldRate) : '—'}${provFrom(pv, 'quality_yield')}<br>
                    OEE：${r.oee != null ? fmtPct(r.oee) : '—'}${r.oee != null
                        ? provBadge('derived', '可用率 × 性能率 × 质量率')
                        : ''}<br>
                    人数：${r.operators ?? '—'}${provFrom(pv, 'operators')}<br>
                    日产能：${r.dailyCapacity != null ? r.dailyCapacity.toFixed(2) + ' 件/日' : '—'}${r.dailyCapacity != null ? provBadge('derived', 'Available ÷ C/T') : ''}<br>
                    实际日产能：${r.actualDailyCapacity != null ? r.actualDailyCapacity.toFixed(2) + ' 件/日' : '—'}${r.actualDailyCapacity != null ? provBadge('derived', '(Available × Uptime) ÷ C/T') : ''}<br>
                    批量加工：${r.batchProcessTime != null ? fmtMinutes(r.batchProcessTime) : '—'}${r.batchProcessTime != null ? provBadge('derived', 'Batch×C/T + C/O') : ''}
                    ${r.resources ? `<br>资源：${esc(r.resources)}` : ''}
                    ${r.dataStatus ? `<br><span class="hint">行状态：${esc(r.dataStatus)}</span>` : ''}
                </td>
            </tr>
        `;
        }).join('');
        return `
            ${renderProvenanceLegend(m)}
            <h4>工序数据框计算结果</h4>
            <table class="metrics-kv">
                <tr><th>工序</th><th>关键参数</th></tr>
                ${rows || '<tr><td colspan="2">无工序数据</td></tr>'}
            </table>
        `;
    }

    function renderMetricsLoss(m) {
        const waitRows = m.waitTop.map((r, i) => `
            <tr class="${i === 0 ? 'danger' : ''}">
                <td>#${i + 1} ${esc(r.id)} ${esc(r.name)}</td>
                <td>${fmtMinutes(r.wait)}${provFrom(r.provenance, 'wait_time_minutes')}（占等待 ${m.waitMin > 0 ? ((r.wait / m.waitMin) * 100).toFixed(1) : 0}%${provBadge('derived', '该等待 ÷ Σ等待')}）</td>
            </tr>
        `).join('');
        const ctRows = m.ctTop.map((r, i) => `
            <tr class="${i === 0 ? 'highlight' : ''}">
                <td>#${i + 1} ${esc(r.id)} ${esc(r.name)}</td>
                <td>${fmtMinutes(r.ct)}${provFrom(r.provenance, 'cycle_time_minutes')}（占加工 ${m.processingMin > 0 ? ((r.ct / m.processingMin) * 100).toFixed(1) : 0}%${provBadge('derived', '该 C/T ÷ ΣC/T')}）</td>
            </tr>
        `).join('');
        return `
            ${renderProvenanceLegend(m)}
            <h4>等待贡献 Top${m.pltUsesCriticalPath ? '（关键路径）' : ''}</h4>
            <table class="metrics-kv">
                <tr><th>位置</th><th>等待 / 占比</th></tr>
                ${waitRows || '<tr><td colspan="2">无等待数据</td></tr>'}
            </table>
            <h4>加工 C/T 贡献 Top${m.pltUsesCriticalPath ? '（关键路径）' : ''}</h4>
            <table class="metrics-kv">
                <tr><th>工序</th><th>C/T / 占比</th></tr>
                ${ctRows || '<tr><td colspan="2">无加工数据</td></tr>'}
            </table>
        `;
    }

    function renderMetricsFormulas(m) {
        const items = [
            {
                name: '客户节拍 Takt Time',
                eq: 'Takt = Available Production Time ÷ Customer Demand',
                note: '可用生产时间 ÷ 客户日需求；无日需求时不计算。'
            },
            {
                name: '工序日产能 Daily Capacity',
                eq: 'Daily Capacity = Available Time ÷ C/T\nActual = (Available Time × Uptime) ÷ C/T',
                note: '评估瓶颈：实际日产能最低的工序通常是约束点。'
            },
            {
                name: '批量加工时间',
                eq: 'Batch Processing Time = Batch Size × C/T + C/O',
                note: '含换型的批量作业时长。'
            },
            {
                name: 'Processing Time（总加工时间）',
                eq: 'Processing Time = Σ 各工序 C/T',
                note: '价值流阶梯下层合计；通常作为增值时间近似。'
            },
            {
                name: '库存等待时间 Waiting Time',
                eq: 'Waiting = Inventory Qty ÷ Daily Demand（或日消耗）\n或直接使用字段 wait_time_minutes',
                note: '本面板优先使用 JSON/Excel 中已折算的等待分钟。'
            },
            {
                name: 'Production Lead Time',
                eq: '串行：PLT = Σ Waiting + Σ C/T\n并行：PLT = Σ_关键路径 (Waiting + C/T)',
                note: '有分叉/合流时与图底时间阶梯一致：取等待+C/T 最长路径，并行支线时间不重复相加。必须 ≥ Processing Time。'
            },
            {
                name: 'VA Ratio（增值比）',
                eq: 'VA Ratio = (VA Time ÷ PLT) × 100%\n本工具默认 VA Time ≈ Processing Time（并行时亦为关键路径 ΣC/T）',
                note: '用于判断整体浪费程度。'
            },
            {
                name: '累计良品率 Rolled Yield',
                eq: 'Rolled Yield = ∏ 各工序 Yield',
                note: '各工序合格率连乘。'
            },
            {
                name: '设备综合效率 OEE',
                eq: 'OEE = Availability × Performance × Quality\n本工具：OEE = 稼动率 × 性能率 × 合格率',
                note: '可用率用表内稼动率（Uptime）；质量率用一次合格率；性能率读 ie_data.performance_rate，缺省按 100%。总览给出工序 OEE 均值与最低 OEE 工序。'
            },
            {
                name: '容器数量 Containers',
                eq: 'Containers = Inventory Quantity ÷ Container Capacity',
                note: '有库存件数与容器容量时可算。'
            }
        ];
        const legend = m ? renderProvenanceLegend(m) : '';
        return `${legend}<h4>公式说明</h4>` + items.map((it) => `
            <div class="metrics-formula">
                <div class="name">${esc(it.name)} ${provBadge('derived')}</div>
                <div class="eq">${esc(it.eq).replace(/\n/g, '<br>')}</div>
                <div class="note">${esc(it.note)}</div>
            </div>
        `).join('');
    }

    function vsmExportBaseName() {
        if (currentTab === 'symbols') return 'VSM_标准符号表';
        const meta = lastLayout?.data?.value_stream_meta?.name || lastLayout?.data?.name;
        if (meta) {
            return String(meta).replace(/[\\/:*?"<>|]/g, '_').replace(/\s+/g, '_').slice(0, 48);
        }
        return 'VSM_价值流图';
    }

    function escXmlDrawio(s) {
        return String(s ?? '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&apos;');
    }

    /** 串行图没有 graphLayout 时，用列坐标拼一份导出用布局 */
    function buildLinearExportLayout(L) {
        const layout = {};
        let x = 0;
        const yFlow = 160;
        (L.cols || []).forEach((col, i) => {
            const w = (L.widths && L.widths[i]) != null ? L.widths[i] : colWidth(col);
            if (col.type === 'truck-in') {
                layout.__INBOUND__ = {
                    xLeft: x, xCenter: x + w / 2, xRight: x + w, yFlow
                };
            } else if (col.type === 'truck-out') {
                layout.__OUTBOUND__ = {
                    xLeft: x, xCenter: x + w / 2, xRight: x + w, yFlow
                };
            } else if (col.type === 'process' && col.id) {
                layout[col.id] = {
                    xLeft: x, xCenter: x + w / 2, xRight: x + w, yFlow, rank: i
                };
            }
            x += w;
        });
        return layout;
    }

    function getDrawioExportContext() {
        const L = lastLayout;
        if (!L?.data) return null;
        const graph = L.data.graph
            || (Array.isArray(lastMacroRaw?.processes)
                ? buildProcessGraph(lastMacroRaw.processes)
                : null);
        if (!graph?.processIds?.length) return null;

        let layout = L.graphLayout?.layout || null;
        if (!layout) layout = buildLinearExportLayout(L);
        if (!layout || !Object.keys(layout).length) return null;
        return { L, data: L.data, graph, layout };
    }

    function processDrawioLabel(p) {
        const lines = [p.name || p.id || '工序'];
        const data = p.data || {};
        ['C/T', 'C/O', '稼动率', '性能率', '一次合格率', 'OEE'].forEach((k) => {
            if (data[k] != null && String(data[k]).trim() !== '') {
                lines.push(`${k}: ${data[k]}`);
            }
        });
        if (p.is_bottleneck || (p.name && String(p.name).includes('瓶颈'))) {
            lines.push('[瓶颈]');
        }
        return lines.map(escXmlDrawio).join('&#xa;');
    }

    function buildDrawioXml(ctx) {
        const { data, graph, layout } = ctx;
        const boxW = Math.max(LAYOUT.process, 150);
        const boxH = 128;
        const truckW = 90;
        const truckH = 56;
        const invSize = 28;
        let cells = '';
        let uid = 1;
        const nextId = (prefix) => `${prefix}${uid++}`;

        const title = lastMacroRaw?.value_stream_meta?.name
            || data.value_stream_meta?.name
            || data.name
            || '价值流图';
        const cp = Array.isArray(data.criticalPath)
            ? data.criticalPath.filter((id) => id && !String(id).startsWith('__')).join(' → ')
            : '';
        const summary = data.timeline_summary || {};
        const noteParts = [
            title,
            cp ? `关键路径: ${cp}` : '',
            summary.production_lead_time ? `PLT: ${summary.production_lead_time}` : '',
            summary.processing_time ? `Processing: ${summary.processing_time}` : '',
            summary.value_added_ratio ? `VA: ${summary.value_added_ratio}` : ''
        ].filter(Boolean);

        cells += `
        <mxCell id="${nextId('note')}" value="${noteParts.map(escXmlDrawio).join('&#xa;')}"
          style="text;html=1;strokeColor=none;fillColor=none;align=left;verticalAlign=top;fontSize=12;fontStyle=1"
          vertex="1" parent="1">
          <mxGeometry x="20" y="8" width="480" height="80" as="geometry"/>
        </mxCell>`;

        const inPos = layout.__INBOUND__;
        if (inPos) {
            const label = data.inbound?.label || '入库';
            cells += `
        <mxCell id="__INBOUND__" value="${['卡车', label].map(escXmlDrawio).join('&#xa;')}"
          style="rounded=1;whiteSpace=wrap;html=1;fillColor=#fff2cc;strokeColor=#d6b656;fontSize=10;fontStyle=1;"
          vertex="1" parent="1">
          <mxGeometry x="${Math.round(inPos.xLeft)}" y="${Math.round(inPos.yFlow - truckH / 2)}"
            width="${truckW}" height="${truckH}" as="geometry"/>
        </mxCell>`;
        }

        const outPos = layout.__OUTBOUND__;
        if (outPos) {
            const label = data.outbound?.label || '出库';
            cells += `
        <mxCell id="__OUTBOUND__" value="${['卡车', label].map(escXmlDrawio).join('&#xa;')}"
          style="rounded=1;whiteSpace=wrap;html=1;fillColor=#fff2cc;strokeColor=#d6b656;fontSize=10;fontStyle=1;"
          vertex="1" parent="1">
          <mxGeometry x="${Math.round(outPos.xLeft)}" y="${Math.round(outPos.yFlow - truckH / 2)}"
            width="${truckW}" height="${truckH}" as="geometry"/>
        </mxCell>`;
        }

        graph.processIds.forEach((id) => {
            const pos = layout[id];
            const p = data.processById?.[id];
            if (!pos || !p) return;
            const isBn = !!(p.is_bottleneck || (p.name && String(p.name).includes('瓶颈')));
            const fill = isBn ? '#ffe6cc' : '#dae8fc';
            const stroke = isBn ? '#d79b00' : '#6c8ebf';
            const x = Math.round(pos.xLeft);
            const y = Math.round(pos.yFlow - boxH / 2);
            cells += `
        <mxCell id="${escXmlDrawio(id)}" value="${processDrawioLabel(p)}"
          style="rounded=0;whiteSpace=wrap;html=1;align=left;verticalAlign=top;spacingLeft=6;spacingTop=4;fontSize=10;fillColor=${fill};strokeColor=${stroke};strokeWidth=${isBn ? 2 : 1};"
          vertex="1" parent="1">
          <mxGeometry x="${x}" y="${y}" width="${boxW}" height="${boxH}" as="geometry"/>
        </mxCell>`;
        });

        (graph.edges || []).forEach((edge) => {
            const from = edge.from;
            const to = edge.to;
            if (!layout[from] || !layout[to]) return;
            // 虚拟端点已建成 vertex 时可连；仅工序之间也连
            const edgeId = nextId('e');
            const waitStr = edge.wait != null ? minutesToDuration(edge.wait) : '';
            const label = waitStr && waitStr !== '0' ? waitStr : '';
            cells += `
        <mxCell id="${edgeId}" value="${escXmlDrawio(label)}"
          style="edgeStyle=orthogonalEdgeStyle;rounded=0;orthogonalLoop=1;jettySize=auto;html=1;strokeColor=#0d47a1;strokeWidth=2;fontColor=#c62828;fontStyle=1;fontSize=11;endArrow=block;endFill=1;"
          edge="1" parent="1" source="${escXmlDrawio(from)}" target="${escXmlDrawio(to)}">
          <mxGeometry relative="1" as="geometry"/>
        </mxCell>`;

            // 工序前库存三角（非入库边）
            if (to !== '__OUTBOUND__' && from !== '__INBOUND__' && layout[to]) {
                const a = layout[from];
                const b = layout[to];
                const ix = Math.round((a.xRight + b.xLeft) / 2 - invSize / 2);
                const iy = Math.round(((a.yFlow + b.yFlow) / 2) + 18);
                cells += `
        <mxCell id="${nextId('inv')}" value="I"
          style="triangle;whiteSpace=wrap;html=1;fillColor=#fff2cc;strokeColor=#d6b656;fontStyle=1;fontSize=11;direction=north;"
          vertex="1" parent="1">
          <mxGeometry x="${ix}" y="${iy}" width="${invSize}" height="${invSize}" as="geometry"/>
        </mxCell>`;
            }
        });

        // 供应商 / 客户（信息层示意，通用矩形，避免依赖 lean 形状库）
        if (data.supplier?.name && inPos) {
            cells += `
        <mxCell id="${nextId('sup')}" value="${['供应商', data.supplier.name].map(escXmlDrawio).join('&#xa;')}"
          style="shape=trapezoid;perimeter=trapezoidPerimeter;whiteSpace=wrap;html=1;fixedSize=1;fillColor=#f5f5f5;strokeColor=#666666;fontSize=10;"
          vertex="1" parent="1">
          <mxGeometry x="${Math.round(inPos.xLeft)}" y="90" width="100" height="50" as="geometry"/>
        </mxCell>`;
        }
        if (data.customer?.name && outPos) {
            cells += `
        <mxCell id="${nextId('cust')}" value="${['客户', data.customer.name].map(escXmlDrawio).join('&#xa;')}"
          style="shape=trapezoid;perimeter=trapezoidPerimeter;whiteSpace=wrap;html=1;fixedSize=1;fillColor=#f5f5f5;strokeColor=#666666;fontSize=10;"
          vertex="1" parent="1">
          <mxGeometry x="${Math.round(outPos.xLeft)}" y="90" width="100" height="50" as="geometry"/>
        </mxCell>`;
        }

        const pageW = Math.max(1200, Math.round((L_totalWidth(ctx) || 1400) + 80));
        const pageH = Math.max(800, Math.round(estimateDrawioPageHeight(layout) + 120));

        return `<?xml version="1.0" encoding="UTF-8"?>
<mxfile host="app.diagrams.net" modified="${new Date().toISOString()}" agent="vsm-macro" version="22.0.0" type="device">
  <diagram id="vsm-export" name="${escXmlDrawio(title)}">
    <mxGraphModel dx="1400" dy="900" grid="1" gridSize="10" guides="1" tooltips="1" connect="1" arrows="1" fold="1" page="1" pageScale="1" pageWidth="${pageW}" pageHeight="${pageH}" math="0" shadow="0">
      <root>
        <mxCell id="0"/>
        <mxCell id="1" parent="0"/>
${cells}
      </root>
    </mxGraphModel>
  </diagram>
</mxfile>`;
    }

    function L_totalWidth(ctx) {
        const L = ctx.L;
        if (L.graphLayout?.totalW) return L.graphLayout.totalW;
        if (L.timelineW) return L.timelineW;
        if (L.totalW) return L.totalW;
        return null;
    }

    function estimateDrawioPageHeight(layout) {
        let maxY = 400;
        Object.keys(layout || {}).forEach((k) => {
            const y = Number(layout[k]?.yFlow) || 0;
            if (y > maxY) maxY = y;
        });
        return maxY + 220;
    }

    function downloadDrawio() {
        if (currentTab === 'symbols') {
            alert('符号表页请先切到价值流图并渲染后再导出。');
            return;
        }
        const ctx = getDrawioExportContext();
        if (!ctx) {
            alert('请先渲染价值流图，再导出 Draw.io。');
            return;
        }
        try {
            const xml = buildDrawioXml(ctx);
            const blob = new Blob([xml], { type: 'application/xml;charset=utf-8' });
            const ts = new Date().toISOString().slice(0, 19).replace(/[:-]/g, '').replace('T', '_');
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `${vsmExportBaseName()}_${ts}.drawio`;
            document.body.appendChild(a);
            a.click();
            a.remove();
            URL.revokeObjectURL(a.href);
        } catch (e) {
            alert('导出 Draw.io 失败：' + (e.message || e));
        }
    }

    async function saveVsmAsImage() {
        const btn = document.getElementById('btn-save-image');
        const out = document.getElementById('output');
        const target = out.querySelector('.vsm-template, .symbol-sheet');
        if (!target) {
            alert('请先在左侧渲染价值流图，再保存图片。');
            return;
        }
        if (typeof html2canvas !== 'function') {
            alert('图片导出库未加载，请检查网络后刷新页面重试。');
            return;
        }

        const prevText = btn.textContent;
        btn.disabled = true;
        btn.textContent = '正在生成图片…';
        try {
            const canvas = await html2canvas(target, {
                backgroundColor: '#ffffff',
                scale: Math.min(3, Math.max(2, window.devicePixelRatio || 2)),
                useCORS: true,
                logging: false,
                width: target.scrollWidth,
                height: target.scrollHeight,
                windowWidth: target.scrollWidth,
                windowHeight: target.scrollHeight,
                scrollX: 0,
                scrollY: 0,
                onclone: (doc) => {
                    const cloned = doc.querySelector('.vsm-template, .symbol-sheet');
                    if (cloned) cloned.style.background = '#fff';
                }
            });
            const ts = new Date().toISOString().slice(0, 19).replace(/[:-]/g, '').replace('T', '_');
            const link = document.createElement('a');
            link.download = `${vsmExportBaseName()}_${ts}.png`;
            link.href = canvas.toDataURL('image/png');
            document.body.appendChild(link);
            link.click();
            link.remove();
        } catch (e) {
            alert('保存图片失败：' + (e.message || e));
        } finally {
            btn.disabled = false;
            btn.textContent = prevText;
        }
    }

    function render() {
        const out = document.getElementById('output');
        const err = document.getElementById('error');
        try {
            if (currentTab === 'symbols') {
                activeInlineEditor = null;
                err.style.display = 'none';
                out.innerHTML = renderSymbolSheet();
                return;
            }
            const raw = JSON.parse(document.getElementById('json-input').value);
            const { data } = normalizeInput(raw);
            if (!data.processes?.length) throw new Error('processes 不能为空');

            err.style.display = 'none';
            lastMacroRaw = raw;
            lastMetrics = computeVsmMetrics(raw, data);
            out.innerHTML = renderMap(data);
            requestAnimationFrame(() => drawLadder());
            if (metricsPanelOpen) refreshMetricsPanel();
        } catch (e) {
            activeInlineEditor = null;
            lastMacroRaw = null;
            lastMetrics = null;
            err.textContent = e.message;
            err.style.display = 'block';
            if (metricsPanelOpen) refreshMetricsPanel();
        }
    }

    document.getElementById('json-input').value = JSON.stringify(DEFAULT_DATA, null, 2);
    document.getElementById('nl-input').value = NL_EXAMPLE_TEXT;
    loadNlSettings();
    ['nl-api-key', 'nl-model', 'nl-base-url'].forEach((id) => {
        document.getElementById(id).addEventListener('change', saveNlSettings);
    });
    switchInputMode('nl');
    initMapInlineEdit();
    render();
    </script>
</body>
</html>
