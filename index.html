<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VSM 绘制工具（Macro JSON 版）</title>
    <style>
        :root {
            --zone-info: #ef9a9a;
            --zone-mat: #90caf9;
            --zone-time: #fff59d;
            --proc-bg: #b3e5fc;
            --inv-bg: #fff59d;
            --pc-header: #ffcc80;
            --mat-arrow: #1565c0;
            --black: #000;
            --red: #c62828;
            --green: #2e7d32;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: #eceff1;
            padding: 12px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            background: #fff;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 12px;
            box-shadow: 0 1px 3px rgba(0,0,0,.1);
        }
        header h1 { margin: 0 0 4px; font-size: 18px; }
        header p { margin: 0; font-size: 12px; color: #555; }
        .layout { display: flex; gap: 12px; flex: 1; min-height: 0; }
        .panel {
            background: #fff;
            border: 1px solid #cfd8dc;
            border-radius: 8px;
            padding: 10px;
            display: flex;
            flex-direction: column;
        }
        .input-panel { flex: 2; min-width: 280px; }
        .output-panel { flex: 5; overflow: auto; min-height: 0; }
        .output-toolbar {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            padding-bottom: 8px;
            border-bottom: 1px solid #e0e0e0;
            flex-shrink: 0;
        }
        .output-toolbar button {
            margin: 0;
        }
        .output-toolbar button.outline {
            background: #fff;
            color: #1565c0;
            border: 1px solid #1565c0;
        }
        .output-toolbar button:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }
        .output-toolbar .hint {
            margin: 0;
        }
        .output-toolbar button.active-panel {
            background: #1565c0;
            color: #fff;
            border-color: #1565c0;
        }
        .output-body {
            display: flex;
            gap: 10px;
            align-items: stretch;
            min-height: 0;
            flex: 1;
        }
        .output-body #output {
            flex: 1;
            min-width: 0;
            overflow: auto;
        }
        .metrics-panel {
            display: none;
            width: 380px;
            max-width: 42vw;
            flex-shrink: 0;
            border: 1px solid #cfd8dc;
            border-radius: 8px;
            background: #fafafa;
            overflow: hidden;
            flex-direction: column;
            max-height: calc(100vh - 160px);
        }
        .metrics-panel.open { display: flex; }
        .metrics-panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
            background: #1565c0;
            color: #fff;
            font-size: 13px;
            font-weight: bold;
        }
        .metrics-panel-header button {
            margin: 0;
            padding: 4px 10px;
            background: rgba(255,255,255,.2);
            font-size: 12px;
            font-weight: normal;
        }
        .metrics-tabs {
            display: flex;
            gap: 0;
            border-bottom: 1px solid #cfd8dc;
            background: #fff;
        }
        .metrics-tabs button {
            flex: 1;
            margin: 0;
            padding: 8px 4px;
            border-radius: 0;
            background: #fff;
            color: #455a64;
            font-size: 11px;
            font-weight: normal;
            border-bottom: 2px solid transparent;
        }
        .metrics-tabs button.active {
            color: #1565c0;
            font-weight: bold;
            border-bottom-color: #1565c0;
            background: #e3f2fd;
        }
        .metrics-panel-body {
            flex: 1;
            overflow: auto;
            padding: 10px 12px;
            font-size: 12px;
            color: #333;
        }
        .metrics-panel-body h4 {
            margin: 12px 0 6px;
            font-size: 12px;
            color: #1565c0;
        }
        .metrics-panel-body h4:first-child { margin-top: 0; }
        .metrics-kv {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 8px;
            background: #fff;
        }
        .metrics-kv th, .metrics-kv td {
            border: 1px solid #e0e0e0;
            padding: 5px 7px;
            text-align: left;
            vertical-align: top;
        }
        .metrics-kv th {
            background: #eceff1;
            width: 42%;
            font-weight: 600;
            color: #455a64;
        }
        .metrics-kv tr.highlight td {
            background: #fff8e1;
        }
        .metrics-kv tr.danger td {
            background: #ffebee;
        }
        .prov {
            display: inline-block;
            font-size: 10px;
            font-weight: 600;
            line-height: 1.4;
            padding: 0 5px;
            border-radius: 3px;
            margin-left: 4px;
            vertical-align: middle;
            white-space: nowrap;
        }
        .prov-input { background: #e8f5e9; color: #2e7d32; border: 1px solid #a5d6a7; }
        .prov-derived { background: #e3f2fd; color: #1565c0; border: 1px solid #90caf9; }
        .prov-quality {
            display: inline-block;
            font-size: 10px;
            color: #888;
            margin-left: 2px;
        }
        .prov-legend {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 10px;
            padding: 8px;
            margin-bottom: 10px;
            background: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            font-size: 11px;
            color: #555;
        }
        .prov-legend .item { display: flex; align-items: center; gap: 4px; }
        .prov-summary {
            font-size: 11px;
            color: #555;
            margin: 0 0 8px;
            line-height: 1.5;
        }
        .metrics-formula {
            background: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            padding: 8px;
            margin-bottom: 8px;
        }
        .metrics-formula .name { font-weight: bold; color: #1565c0; }
        .metrics-formula .eq {
            font-family: Consolas, 'Microsoft YaHei', monospace;
            font-size: 11px;
            color: #37474f;
            margin: 4px 0;
            word-break: break-all;
        }
        .metrics-formula .note { font-size: 11px; color: #78909c; }
        .metrics-empty {
            color: #78909c;
            font-size: 12px;
            padding: 16px 8px;
            text-align: center;
        }
        #output { min-width: 0; }
        textarea {
            flex: 1;
            min-height: 300px;
            width: 100%;
            font: 12px Consolas, monospace;
            background: #1e1e1e;
            color: #d4d4d4;
            border-radius: 4px;
            padding: 8px;
            border: 1px solid #444;
        }
        button {
            margin-top: 8px;
            padding: 9px 16px;
            background: #1565c0;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }
        .tabs { display: flex; gap: 6px; margin-bottom: 8px; }
        .tabs button { margin: 0; background: #e0e0e0; color: #333; font-weight: normal; }
        .tabs button.active { background: #1565c0; color: #fff; }
        .error { display: none; margin-top: 8px; padding: 8px; background: #ffcdd2; color: #b71c1c; font-size: 12px; border-radius: 4px; }
        .notice { display: none; margin-top: 8px; padding: 8px; background: #fff8e1; color: #e65100; font-size: 12px; border-radius: 4px; border: 1px solid #ffcc80; }
        .hint { font-size: 11px; color: #777; margin-top: 6px; }
        .excel-toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 8px;
            align-items: center;
        }
        .excel-toolbar button { margin-top: 0; }
        .excel-toolbar button.secondary {
            background: #546e7a;
        }
        .excel-toolbar button.outline {
            background: #fff;
            color: #1565c0;
            border: 1px solid #1565c0;
        }
        .excel-toolbar input[type="file"] { display: none; }
        .excel-status {
            font-size: 11px;
            color: #2e7d32;
            margin-top: 4px;
            display: none;
        }
        .input-mode-tabs { display: flex; gap: 6px; margin-bottom: 8px; }
        .input-mode-tabs button {
            flex: 1;
            margin: 0;
            padding: 8px 12px;
            font-size: 12px;
            background: #eceff1;
            color: #455a64;
            font-weight: normal;
        }
        .input-mode-tabs button.active {
            background: #1565c0;
            color: #fff;
            font-weight: bold;
        }
        .input-mode-body { flex: 1; min-height: 0; display: flex; flex-direction: column; }
        .nl-panel { display: none; flex-direction: column; flex: 1; min-height: 0; }
        .nl-panel.active { display: flex; }
        .json-panel { display: none; flex-direction: column; flex: 1; min-height: 0; }
        .json-panel.active { display: flex; }
        .nl-desc {
            flex: 1;
            min-height: 280px;
            width: 100%;
            font: 12px 'Microsoft YaHei', sans-serif;
            border-radius: 4px;
            padding: 8px;
            border: 1px solid #b0bec5;
            resize: vertical;
            line-height: 1.5;
        }
        .nl-config {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            margin: 8px 0;
            font-size: 11px;
        }
        .nl-config label { display: flex; flex-direction: column; gap: 2px; color: #546e7a; }
        .nl-config label.full { grid-column: 1 / -1; }
        .nl-config input, .nl-config select {
            padding: 6px 8px;
            border: 1px solid #b0bec5;
            border-radius: 4px;
            font-size: 12px;
        }
        .nl-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
        .nl-actions button { margin-top: 0; }
        .nl-actions button.secondary { background: #546e7a; }
        .nl-actions button:disabled { opacity: 0.55; cursor: not-allowed; }
        .nl-hint { font-size: 11px; color: #777; margin: 0 0 8px; line-height: 1.45; }

        .vsm-template { min-width: max-content; padding: 8px; }
        .vsm-zone {
            position: relative;
            border: 2px dashed;
            border-radius: 6px;
            margin-bottom: 10px;
            padding: 28px 12px 12px;
        }
        .vsm-zone.info { border-color: var(--zone-info); background: rgba(239,154,154,.08); }
        .vsm-zone.material { border-color: var(--zone-mat); background: rgba(144,202,249,.08); }
        .vsm-zone.timeline { border-color: var(--zone-time); background: rgba(255,245,157,.12); }
        .zone-badge {
            position: absolute;
            top: 6px;
            left: 10px;
            font-size: 12px;
            font-weight: bold;
            padding: 2px 10px;
            border-radius: 3px;
            background: #fff;
            border: 1px solid rgba(0,0,0,.2);
        }
        .vsm-zone.info .zone-badge { color: #b71c1c; }
        .vsm-zone.material .zone-badge { color: #0d47a1; }
        .vsm-zone.timeline .zone-badge { color: #f57f17; }
        .vsm-grid { display: flex; align-items: stretch; }
        .vsm-col { flex-shrink: 0; display: flex; flex-direction: column; position: relative; }
        .col-truck { width: 88px; }
        .col-link { width: 96px; }
        .col-process { width: 128px; }

        .info-band { height: 88px; position: relative; }
        .info-entity {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            height: 100%;
            padding-bottom: 4px;
        }
        .info-entity .lbl {
            font-size: 10px;
            font-weight: bold;
            text-align: center;
            max-width: 84px;
            line-height: 1.2;
            margin-top: 2px;
            min-height: 24px;
        }
        .pc-wrap {
            position: absolute;
            top: 4px;
            transform: translateX(-50%);
            z-index: 5;
        }
        .pc-box {
            border: 2px solid var(--black);
            background: #fff;
            width: 150px;
            min-width: 150px;
            text-align: center;
            box-shadow: 2px 2px 0 rgba(0,0,0,.15);
        }
        .pc-header {
            background: var(--pc-header);
            border-bottom: 2px solid var(--black);
            padding: 4px 12px;
            font-size: 12px;
            font-weight: bold;
        }
        .info-stage { position: relative; }
        .info-stage .vsm-grid {
            position: absolute;
            left: 0;
            top: var(--info-grid-top);
            width: 100%;
            z-index: 2;
        }
        .info-stage .pc-wrap { top: var(--info-pc-top); }
        .info-flow-svg {
            position: absolute;
            left: 0;
            top: 0;
            z-index: 6; /* 高于 pc-wrap(5)，避免折线被计划框遮挡 */
            pointer-events: none;
            overflow: visible;
        }

        .vsm-zone.material {
            --process-top: 56px;
            --process-h: 40px;
            --arrow-h: 16px;
            --flow-center: calc(var(--process-top) + var(--process-h) / 2);
            --arrow-top: calc(var(--flow-center) - var(--arrow-h) / 2);
            --arrow-bottom: calc(var(--flow-center) + var(--arrow-h) / 2);
            --inv-gap: 8px;
            --inv-top: calc(var(--arrow-bottom) + var(--inv-gap));
        }
        .mat-band { min-height: 200px; position: relative; padding-top: 8px; }
        .mat-arrow-row {
            position: absolute;
            top: var(--arrow-top);
            left: 0;
            width: 100%;
            height: var(--arrow-h);
            z-index: 1;
        }
        .col-process .mat-band { padding-top: 0; }
        .mat-inv-row {
            position: absolute;
            top: var(--inv-top);
            left: 0;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 2;
        }
        .inv-qty-below { font-size: 11px; font-weight: bold; margin-top: 2px; }
        .mat-process {
            margin-top: var(--process-top);
            width: 100%;
            min-height: var(--process-h);
            height: var(--process-h);
            background: var(--proc-bg);
            border: 2px solid var(--black);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 11px;
            font-weight: bold;
            padding: 4px;
            position: relative;
            z-index: 3;
        }
        .mat-process.bottleneck {
            background: #ffecb3;
            border-color: #e65100;
            box-shadow: inset 0 0 0 1px #ff9800;
        }
        .vsm-edit-name,
        .vsm-edit-entity,
        .vsm-edit-flow {
            cursor: pointer;
            border-bottom: 1px dashed transparent;
            line-height: 1.25;
        }
        .vsm-edit-name:hover,
        .vsm-edit-entity:hover,
        .vsm-edit-flow:hover {
            border-bottom-color: #1565c0;
            color: #0d47a1;
        }
        .vsm-edit-name-input {
            flex: 1;
            min-width: 0;
            font: inherit;
            font-weight: bold;
            font-size: 11px;
            text-align: center;
            border: 2px solid #1565c0;
            border-radius: 2px;
            padding: 2px 4px;
            box-sizing: border-box;
            background: #fff;
            outline: none;
        }
        .info-entity .vsm-edit-name-input {
            font-size: 10px;
            max-width: 84px;
        }
        .pc-header .vsm-edit-name-input {
            width: 100%;
            min-width: 72px;
            font-size: 11px;
            padding: 1px 4px;
        }
        .mat-truck .vsm-edit-name-input,
        .mat-graph-truck .vsm-edit-name-input {
            font-size: 9px;
            max-width: 80px;
        }
        .mat-operator { position: absolute; top: -14px; right: 4px; }
        .mat-data {
            width: 100%;
            border-collapse: collapse;
            font-size: 9px;
            margin-top: 4px;
            background: #e3f2fd;
        }
        .mat-data td { border: 1px solid var(--black); padding: 2px 3px; text-align: center; }
        .mat-data .vsm-edit-data {
            cursor: pointer;
        }
        .mat-data .vsm-edit-data:hover {
            color: #0d47a1;
            background: #bbdefb;
        }
        .mat-data .vsm-edit-name-input {
            width: 100%;
            max-width: none;
            font-size: 9px;
            padding: 1px 2px;
        }
        .mat-truck {
            position: absolute;
            top: var(--flow-center);
            left: 0;
            width: 100%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 2;
        }
        .mat-truck .lbl { font-size: 9px; font-weight: bold; margin-top: 4px; text-align: center; }
        .vsm-zone.material .vsm-grid > .col-truck:last-child .mat-arrow-row { width: 58%; }
        .vsm-zone.material .vsm-grid > .col-truck:last-child .mat-truck {
            left: auto;
            right: 0;
            width: auto;
        }

        .timeline-track { position: relative; margin: 10px 8px 0; min-height: 72px; }
        .timeline-track.graph-aligned { margin: 10px 4px 0; }
        .timeline-track svg { display: block; overflow: visible; }
        .timeline-cp-hint {
            font-size: 10px;
            color: #666;
            margin: 4px 8px 0;
            font-style: italic;
        }
        .timeline-cp-hint.graph-aligned { margin: 4px 4px 0; }
        .timeline-summary {
            margin-top: 12px;
            padding: 10px 14px;
            border: 2px solid var(--black);
            background: #fff;
            font-size: 12px;
            line-height: 1.6;
            display: inline-block;
            float: right;
            clear: both;
        }
        .timeline-summary strong { display: block; }

        .symbol-sheet { padding: 8px 12px 24px; }
        .symbol-sheet h2 { font-size: 16px; margin: 0 0 6px; border-bottom: 2px solid #000; padding-bottom: 6px; }
        .symbol-sheet .note { font-size: 12px; color: #555; margin-bottom: 12px; }
        .symbol-table { width: 100%; border-collapse: collapse; font-size: 12px; }
        .symbol-table th, .symbol-table td { border: 1px solid #000; padding: 10px 8px; vertical-align: middle; }
        .symbol-table th { background: #eceff1; text-align: left; }
        .symbol-cell { width: 150px; text-align: center; background: #fafafa; }
        .symbol-cell svg { display: block; margin: 0 auto; }
        .symbol-cell .role-hint { font-size: 10px; color: #666; margin-top: 4px; }

        /* 步骤 3：分叉图物料流（仅物料区使用绝对定位） */
        .mat-canvas {
            position: relative;
            overflow: visible;
            margin: 0 4px;
        }
        .mat-flow-svg {
            position: absolute;
            left: 0;
            top: 0;
            pointer-events: none;
            z-index: 1;
            overflow: visible;
        }
        .mat-graph-truck {
            position: absolute;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 2;
        }
        .mat-graph-truck .lbl { font-size: 9px; font-weight: bold; margin-top: 4px; text-align: center; max-width: 80px; }
        .mat-graph-node {
            position: absolute;
            width: 128px;
            z-index: 2;
        }
        .mat-graph-node .mat-process {
            margin-top: 0;
            height: 40px;
            min-height: 40px;
        }
        .mat-edge-inv {
            position: absolute;
            left: 0;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 3;
            pointer-events: none;
        }
        .mat-edge-inv .inv-qty-below { font-size: 10px; font-weight: bold; margin-top: 2px; }
        .mat-edge-wait {
            position: absolute;
            left: 0;
            transform: translate(-50%, -100%);
            font-size: 10px;
            font-weight: bold;
            color: var(--red);
            z-index: 3;
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <header>
        <h1>VSM 绘制工具（Macro JSON 版）</h1>
        <p>支持自然语言生成、Excel 导入、macro_entities / macro_flows / predecessors 格式</p>
    </header>
    <div class="layout">
        <div class="panel input-panel">
            <div class="tabs">
                <button type="button" id="tab-map" class="active" onclick="switchTab('map')">价值流图</button>
                <button type="button" id="tab-symbols" onclick="switchTab('symbols')">标准符号表</button>
            </div>
            <div class="input-mode-tabs" id="input-mode-tabs">
                <button type="button" id="input-nl" class="active" onclick="switchInputMode('nl')">自然语言</button>
                <button type="button" id="input-json" onclick="switchInputMode('json')">JSON / Excel</button>
            </div>
            <div class="input-mode-body" id="input-mode-body">
                <div class="nl-panel active" id="nl-panel">
                    <p class="nl-hint">用中文描述价值流，生成后将同时得到 Excel（自动下载）与 JSON，并自动切换到「JSON / Excel」页核对。</p>
                    <textarea id="nl-input" class="nl-desc" spellcheck="false" placeholder="示例：某汽轮机叶片加工，4 道工序…"></textarea>
                    <div class="nl-config">
                        <label>API 提供商
                            <select id="nl-provider" onchange="applyNlProviderPreset()">
                                <option value="deepseek">DeepSeek</option>
                                <option value="openai">OpenAI</option>
                                <option value="custom">自定义</option>
                            </select>
                        </label>
                        <label>模型
                            <input type="text" id="nl-model" value="deepseek-chat">
                        </label>
                        <label class="full">API Base URL
                            <input type="text" id="nl-base-url" value="https://api.deepseek.com">
                        </label>
                        <label class="full">API Key（仅保存在本浏览器本次会话）
                            <input type="password" id="nl-api-key" placeholder="sk-..." autocomplete="off">
                        </label>
                    </div>
                    <div class="nl-actions">
                        <button type="button" id="btn-nl-generate" onclick="generateJsonFromNaturalLanguage()">生成 Excel + JSON 并渲染</button>
                        <button type="button" class="secondary" onclick="fillNlExample()">填入示例描述</button>
                    </div>
                </div>
                <div class="json-panel" id="json-panel">
                    <div class="excel-toolbar" id="excel-toolbar">
                        <button type="button" class="outline" onclick="downloadExcelTemplate()">下载 Excel 模板</button>
                        <button type="button" class="outline" onclick="downloadCurrentJsonAsExcel()">下载当前 Excel</button>
                        <button type="button" class="secondary" onclick="document.getElementById('excel-file').click()">导入 Excel</button>
                        <input type="file" id="excel-file" accept=".xlsx,.xls,.csv" onchange="importExcelFile(this.files[0])">
                    </div>
                    <textarea id="json-input" spellcheck="false"></textarea>
                    <button type="button" id="btn-render" onclick="render()">渲染</button>
                </div>
            </div>
            <div class="error" id="error"></div>
        </div>
        <div class="panel output-panel">
            <div class="output-toolbar">
                <button type="button" class="outline" id="btn-save-image" onclick="saveVsmAsImage()">保存 VSM 为图片</button>
                <button type="button" class="outline" id="btn-export-drawio" onclick="downloadDrawio()" title="导出为 .drawio，可用 diagrams.net 打开微调">导出 Draw.io</button>
                <button type="button" class="outline" id="btn-metrics" onclick="toggleMetricsPanel()">关键参数面板</button>
            </div>
            <div class="output-body">
                <div id="output"></div>
                <aside class="metrics-panel" id="metrics-panel" aria-label="关键参数面板">
                    <div class="metrics-panel-header">
                        <span>关键参数与计算公式</span>
                        <button type="button" onclick="toggleMetricsPanel(false)">关闭</button>
                    </div>
                    <div class="metrics-tabs" id="metrics-tabs">
                        <button type="button" class="active" data-tab="overview" onclick="switchMetricsTab('overview')">总览</button>
                        <button type="button" data-tab="process" onclick="switchMetricsTab('process')">工序</button>
                        <button type="button" data-tab="loss" onclick="switchMetricsTab('loss')">损失Top</button>
                        <button type="button" data-tab="formula" onclick="switchMetricsTab('formula')">公式</button>
                    </div>
                    <div class="metrics-panel-body" id="metrics-panel-body">
                        <div class="metrics-empty">请先渲染价值流图，再打开本面板。</div>
                    </div>
                </aside>
            </div>
        </div>
    </div>

    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script>
    const LAYOUT = { truck: 88, link: 96, process: 128 };

    /** 分叉图布局常量（步骤 2 仅计算坐标，步骤 3 才用于绘制） */
    const GRAPH_LAYOUT = {
        paddingTop: 36,
        laneH: 200
    };

    const INFO = {
        gridTop: 28,
        bandH: 88,
        pcTop: 4,
        pcH: 30,
        entSvgH: 52,
        entLabelH: 26,
        entPadBottom: 4
    };
    INFO.stageH = INFO.gridTop + INFO.bandH;
    INFO.entTopY = INFO.gridTop + INFO.bandH - INFO.entPadBottom - INFO.entLabelH - INFO.entSvgH;
    INFO.pcTopY = INFO.pcTop;
    INFO.pcBottomY = INFO.pcTop + INFO.pcH;
    INFO.pcMinW = 150;
    INFO.pcHalfW = INFO.pcMinW / 2;
    INFO.pcSideY = (INFO.pcTopY + INFO.pcBottomY) / 2;
    /* 入/出两条水平路由错开，避免重叠且保证可见弯折 */
    INFO.inLaneY = INFO.pcSideY - 5;
    INFO.outLaneY = INFO.pcSideY + 5;

    /* ========== Macro JSON 适配层 ========== */

    function isMacroFormat(raw) {
        return !!(raw.macro_entities || raw.macro_flows);
    }

    function mapFlowEntity(name) {
        const key = String(name ?? '').toLowerCase().replace(/-/g, '_');
        const table = {
            customer: 'CUSTOMER',
            supplier: 'SUPPLIER',
            production_control: 'PC',
            pc: 'PC',
            erp: 'PC'
        };
        return table[key] || String(name).toUpperCase();
    }

    /** 统一 macro_flows / flows 字段，并规范化端点名 */
    function normalizeFlowEntry(f) {
        if (!f || typeof f !== 'object') return null;
        return {
            from: mapFlowEntity(f.from),
            to: mapFlowEntity(f.to),
            type: f.type || 'electronic_info',
            content: f.content
        };
    }

    function collectFlows(raw) {
        const seen = new Set();
        const out = [];
        [...(raw.macro_flows || []), ...(raw.flows || [])].forEach((f) => {
            const n = normalizeFlowEntry(f);
            if (!n) return;
            const key = `${n.from}|${n.to}|${n.type}|${n.content || ''}`;
            if (seen.has(key)) return;
            seen.add(key);
            out.push(n);
        });
        return out;
    }

    function minutesToDuration(minutes) {
        if (minutes == null || minutes === '') return '';
        let min = minutes;
        if (typeof min === 'object') {
            const a = Number(min.min) || 0;
            const b = Number(min.max) || a;
            if (a !== b) return `${minutesToDuration(a)}~${minutesToDuration(b)}`;
            min = a;
        }
        min = Number(min);
        if (!Number.isFinite(min) || min <= 0) return '0';
        if (min >= 1440 && min % 1440 === 0) return `${min / 1440}d`;
        if (min >= 60 && min % 60 === 0) return `${min / 60}h`;
        if (min >= 60) return `${Math.round(min / 60 * 10) / 10}h`;
        return `${Math.round(min)}min`;
    }

    function minutesToLeadTimeLabel(minutes) {
        const min = Number(minutes);
        if (!Number.isFinite(min) || min <= 0) return '';
        if (min >= 1440) return `${(min / 1440).toFixed(1)}天`;
        if (min >= 60) return `${(min / 60).toFixed(1)}小时`;
        return `${Math.round(min)}分钟`;
    }

    function cycleMinutes(tl) {
        const c = tl?.cycle_time_minutes;
        if (c == null) return 0;
        if (typeof c === 'object') {
            const a = Number(c.min) || 0;
            const b = Number(c.max) || a;
            return (a + b) / 2;
        }
        return Number(c) || 0;
    }

    /** 按 predecessors 拓扑排序（并行分支按 id 稳定排序后压成一条线） */
    function topoSortProcesses(processes) {
        const byId = new Map(processes.map((p) => [p.id, p]));
        const done = new Set();
        const out = [];

        function dfs(id) {
            if (done.has(id)) return;
            const p = byId.get(id);
            if (!p) throw new Error(`predecessors 引用了未知工序: ${id}`);
            (p.predecessors || []).slice().sort().forEach(dfs);
            if (!done.has(id)) {
                done.add(id);
                out.push(p);
            }
        }

        processes.slice().sort((a, b) => String(a.id).localeCompare(String(b.id), 'zh'))
            .forEach((p) => dfs(p.id));

        if (out.length !== processes.length) {
            throw new Error('工序 predecessors 存在环，无法拓扑排序');
        }
        return out;
    }

    /** 是否存在分叉（一对多）或合流（多对一） */
    function hasBranching(rawProcesses) {
        const childCount = new Map();
        rawProcesses.forEach((p) => {
            (p.predecessors || []).forEach((pred) => {
                childCount.set(pred, (childCount.get(pred) || 0) + 1);
            });
        });
        return rawProcesses.some((p) => (p.predecessors || []).length > 1)
            || [...childCount.values()].some((c) => c > 1);
    }

    /** 从 predecessors 构建 DAG 边表（不改渲染，仅保留真实拓扑） */
    function buildProcessGraph(rawProcesses) {
        const edges = [];
        rawProcesses.forEach((p) => {
            const preds = p.predecessors || [];
            if (!preds.length) {
                edges.push({
                    from: '__INBOUND__',
                    to: p.id,
                    wait: p.timeline?.wait_time_minutes
                });
            } else {
                preds.forEach((fromId) => {
                    edges.push({
                        from: fromId,
                        to: p.id,
                        wait: p.timeline?.wait_time_minutes
                    });
                });
            }
        });
        rawProcesses.forEach((p) => {
            if (!edges.some((e) => e.from === p.id)) {
                edges.push({ from: p.id, to: '__OUTBOUND__', wait: null });
            }
        });
        return {
            processIds: rawProcesses.map((p) => p.id),
            edges
        };
    }

    /** 人类可读的 DAG 描述，如 P01→P02/P03→P04 */
    function describeGraphStructure(rawProcesses) {
        const predsOf = (id) => rawProcesses.filter((p) => p.id === id)[0]?.predecessors || [];
        const succsOf = (id) => rawProcesses
            .filter((p) => (p.predecessors || []).includes(id))
            .map((p) => p.id)
            .sort((a, b) => String(a).localeCompare(String(b), 'zh'));

        const roots = rawProcesses
            .filter((p) => !(p.predecessors || []).length)
            .map((p) => p.id)
            .sort((a, b) => String(a).localeCompare(String(b), 'zh'));

        function walk(id, stack) {
            if (stack.has(id)) return id;
            const succs = succsOf(id);
            if (!succs.length) return id;
            if (succs.length === 1) return `${id} → ${walk(succs[0], new Set([...stack, id]))}`;
            const branches = succs.map((s) => walk(s, new Set([...stack, id]))).join(' / ');
            const mergeTargets = [...new Set(succs.flatMap((s) => succsOf(s)))];
            if (mergeTargets.length === 1 && predsOf(mergeTargets[0]).length > 1) {
                return `${id} → (${branches}) → ${walk(mergeTargets[0], new Set([...stack, id, ...succs]))}`;
            }
            return `${id} → (${branches})`;
        }

        if (!roots.length) return rawProcesses.map((p) => p.id).join(' → ');
        return roots.map((r) => walk(r, new Set())).join('；');
    }

    /** 关键路径：合流场景下用于提前期汇总，避免并行分支时间被重复相加 */
    function pickCriticalPath(graph, rawProcesses) {
        const byId = new Map(rawProcesses.map((p) => [p.id, p]));
        const nodeWeight = (id) => {
            if (id === '__INBOUND__' || id === '__OUTBOUND__') return 0;
            const p = byId.get(id);
            return (Number(p?.timeline?.wait_time_minutes) || 0) + cycleMinutes(p?.timeline);
        };
        const memo = new Map();
        function longestFrom(node) {
            if (memo.has(node)) return memo.get(node);
            const outs = graph.edges.filter((e) => e.from === node);
            if (!outs.length) {
                const result = { path: [node], time: nodeWeight(node) };
                memo.set(node, result);
                return result;
            }
            let best = null;
            outs.forEach((e) => {
                const sub = longestFrom(e.to);
                const time = nodeWeight(node) + sub.time;
                if (!best || time > best.time) best = { path: [node, ...sub.path], time };
            });
            memo.set(node, best);
            return best;
        }
        return longestFrom('__INBOUND__').path;
    }

    function computePathTimes(path, rawProcesses) {
        const byId = new Map(rawProcesses.map((p) => [p.id, p]));
        let totalWaitMin = 0;
        let totalCycleMin = 0;
        path.forEach((id) => {
            if (id === '__INBOUND__' || id === '__OUTBOUND__') return;
            const p = byId.get(id);
            totalWaitMin += Number(p?.timeline?.wait_time_minutes) || 0;
            totalCycleMin += cycleMinutes(p?.timeline);
        });
        return { totalWaitMin, totalCycleMin };
    }

    function processXLeft(rank) {
        return LAYOUT.truck + (rank - 1) * (LAYOUT.link + LAYOUT.process) + LAYOUT.link;
    }

    function graphTotalWidth(maxRank) {
        return LAYOUT.truck + maxRank * (LAYOUT.link + LAYOUT.process) + LAYOUT.link + LAYOUT.truck;
    }

    function flowYForLane(laneIndex, laneCount, maxLanes) {
        if (laneCount === 1) {
            return GRAPH_LAYOUT.paddingTop + (maxLanes * GRAPH_LAYOUT.laneH) / 2;
        }
        const span = (laneCount - 1) * GRAPH_LAYOUT.laneH;
        const base = GRAPH_LAYOUT.paddingTop + (maxLanes * GRAPH_LAYOUT.laneH - span) / 2;
        return base + laneIndex * GRAPH_LAYOUT.laneH;
    }

    /**
     * 步骤 2：按列(rank) + 泳道(lane) 计算各节点像素坐标。
     * 列 = 拓扑层级；同列多节点各占一泳道；合流节点 y 取前驱均值。
     */
    function layoutProcessGraph(graph) {
        const ranks = new Map();
        function rank(id) {
            if (id === '__INBOUND__') return 0;
            if (ranks.has(id)) return ranks.get(id);
            const preds = graph.edges.filter((e) => e.to === id).map((e) => e.from);
            const r = preds.length ? Math.max(...preds.map(rank)) + 1 : 1;
            ranks.set(id, r);
            return r;
        }
        graph.processIds.forEach((id) => rank(id));

        const byRank = {};
        graph.processIds.forEach((id) => {
            const r = ranks.get(id);
            (byRank[r] = byRank[r] || []).push(id);
        });
        Object.values(byRank).forEach((arr) => arr.sort((a, b) => String(a).localeCompare(String(b), 'zh')));

        const maxRank = Math.max(...graph.processIds.map((id) => ranks.get(id)));
        const maxLanes = Math.max(...Object.values(byRank).map((a) => a.length), 1);
        const totalW = graphTotalWidth(maxRank);
        const totalH = GRAPH_LAYOUT.paddingTop + maxLanes * GRAPH_LAYOUT.laneH + 100;
        const layout = {};

        Object.entries(byRank).forEach(([rStr, ids]) => {
            const r = +rStr;
            const n = ids.length;
            ids.forEach((id, i) => {
                const xLeft = processXLeft(r);
                layout[id] = {
                    rank: r,
                    laneIndex: i,
                    laneCount: n,
                    xLeft,
                    xCenter: xLeft + LAYOUT.process / 2,
                    xRight: xLeft + LAYOUT.process,
                    yFlow: flowYForLane(i, n, maxLanes)
                };
            });
        });

        graph.processIds.forEach((id) => {
            const preds = graph.edges
                .filter((e) => e.to === id && e.from !== '__INBOUND__')
                .map((e) => e.from);
            if (preds.length > 1) {
                const ys = preds.map((p) => layout[p].yFlow);
                layout[id].yFlow = (Math.min(...ys) + Math.max(...ys)) / 2;
                layout[id].merged = true;
            }
        });

        layout.__INBOUND__ = {
            rank: 0,
            laneIndex: 0,
            xLeft: 0,
            xCenter: LAYOUT.truck / 2,
            xRight: LAYOUT.truck,
            yFlow: flowYForLane(0, 1, maxLanes)
        };
        layout.__OUTBOUND__ = {
            rank: maxRank + 1,
            laneIndex: 0,
            xLeft: totalW - LAYOUT.truck,
            xCenter: totalW - LAYOUT.truck / 2,
            xRight: totalW,
            yFlow: layout.__INBOUND__.yFlow
        };

        return { layout, totalW, totalH, maxRank, maxLanes, ranks };
    }

    /** 布局摘要，供黄条验证（步骤 2 不改画面） */
    function describeLayoutSummary(graphLayout) {
        const { layout, totalW, totalH, maxRank, maxLanes } = graphLayout;
        const nodes = graphLayout.graph?.processIds || Object.keys(layout).filter((k) => !k.startsWith('__'));
        const parts = (Array.isArray(nodes) ? nodes : []).map((id) => {
            const pos = layout[id];
            if (!pos) return id;
            const mergeTag = pos.merged ? '合流' : '';
            return `${id}[列${pos.rank}/泳道${pos.laneIndex}${mergeTag} @${Math.round(pos.xCenter)},${Math.round(pos.yFlow)}]`;
        });
        return `画布 ${totalW}×${totalH}px · ${maxRank}列${maxLanes}泳道 · ${parts.join(' ')}`;
    }

    function convertMacroProcess(p, nextRaw) {
        const tl = p.timeline || {};
        const ie = p.ie_data || {};
        const cycleStr = minutesToDuration(tl.cycle_time_minutes);
        const waitAfter = nextRaw
            ? minutesToDuration(nextRaw.timeline?.wait_time_minutes)
            : '';

        const data = {
            'C/T': cycleStr || '—',
            'C/O': minutesToDuration(tl.setup_time_minutes) || '0'
        };
        if (ie.availability_rate != null) {
            data['稼动率'] = `${Math.round(Number(ie.availability_rate) * 100)}%`;
        }
        if (ie.performance_rate != null) {
            data['性能率'] = `${Math.round(Number(ie.performance_rate) * 100)}%`;
        }
        if (ie.quality_yield != null) {
            data['一次合格率'] = `${Math.round(Number(ie.quality_yield) * 100)}%`;
        }
        if (ie.availability_rate != null && ie.quality_yield != null) {
            const a = Number(ie.availability_rate);
            const q = Number(ie.quality_yield);
            const perf = ie.performance_rate != null ? Number(ie.performance_rate) : 1;
            if (Number.isFinite(a) && Number.isFinite(q) && Number.isFinite(perf)) {
                data['OEE'] = `${Math.round(a * perf * q * 100)}%`;
            }
        }
        if (p.resources?.length) data['资源'] = p.resources.join('、');
        if (p.uaf_mapping?.operational_activity) {
            data['UAF活动'] = p.uaf_mapping.operational_activity;
        }
        if (p.is_bottleneck && p.bottleneck_reason) {
            data['瓶颈说明'] = p.bottleneck_reason;
        }

        let name = p.name || p.id;
        if (p.is_bottleneck && !name.includes('瓶颈')) name += '【瓶颈】';

        return {
            id: p.id,
            name,
            operators: ie.operators ?? 1,
            timeline: { wait: waitAfter, cycle: cycleStr },
            next_link: { type: 'inventory', quantity: 'I' },
            data,
            is_bottleneck: !!p.is_bottleneck
        };
    }

    function normalizeInput(raw) {
        if (!isMacroFormat(raw)) {
            const data = { ...raw };
            const flows = collectFlows(raw);
            if (flows.length) data.flows = flows;
            return { data, warnings: [] };
        }

        const ent = raw.macro_entities || {};
        const rawProcesses = raw.processes || [];
        const sorted = topoSortProcesses(rawProcesses);
        const warnings = [];

        const branching = hasBranching(rawProcesses);
        const graph = buildProcessGraph(rawProcesses);
        const graphDesc = branching ? describeGraphStructure(rawProcesses) : '';
        const criticalPath = branching ? pickCriticalPath(graph, rawProcesses) : null;
        const graphLayout = branching ? layoutProcessGraph(graph) : null;
        if (graphLayout) graphLayout.graph = graph;

        const processes = sorted.map((p, i) => convertMacroProcess(p, sorted[i + 1]));
        if (processes.length) delete processes[processes.length - 1].next_link;
        const processById = Object.fromEntries(processes.map((p) => [p.id, p]));

        const flows = collectFlows(raw);

        let totalWaitMin;
        let totalCycleMin;
        if (branching && criticalPath) {
            ({ totalWaitMin, totalCycleMin } = computePathTimes(criticalPath, rawProcesses));
        } else {
            const firstWaitMin = Number(sorted[0]?.timeline?.wait_time_minutes) || 0;
            totalWaitMin = firstWaitMin;
            totalCycleMin = 0;
            sorted.forEach((p, i) => {
                if (i > 0) totalWaitMin += Number(p.timeline?.wait_time_minutes) || 0;
                totalCycleMin += cycleMinutes(p.timeline);
            });
        }
        const totalMin = totalWaitMin + totalCycleMin;
        const firstWaitMin = Number(
            rawProcesses.find((p) => !(p.predecessors || []).length)?.timeline?.wait_time_minutes
            ?? sorted[0]?.timeline?.wait_time_minutes
        ) || 0;

        const data = {
            supplier: ent.supplier || { name: '供应商' },
            customer: ent.customer || { name: '客户' },
            production_control: ent.production_control || { name: '生产计划部' },
            inbound: raw.inbound || {
                label: '原材料入库',
                wait: minutesToDuration(firstWaitMin) || ''
            },
            outbound: raw.outbound || { label: '成品发运' },
            first_inventory: raw.first_inventory || { type: 'inventory', quantity: 'I' },
            processes,
            processById,
            graph,
            hasBranching: branching,
            graphDesc,
            graphLayout,
            criticalPath,
            flows,
            // Always recompute: PLT = Σ等待 + ΣC/T（inbound 与首工序等待同源时不重复加）
            timeline_summary: {
                production_lead_time: minutesToLeadTimeLabel(totalMin),
                processing_time: minutesToLeadTimeLabel(totalCycleMin),
                value_added_ratio: totalMin > 0
                    ? `${(totalCycleMin / totalMin * 100).toFixed(1)}%`
                    : ''
            }
        };

        return { data, warnings };
    }

    /* ========== 渲染引擎（与原版一致，略作瓶颈高亮） ========== */

    const SVG = {
        externalEntity: (role) => {
            const mark = role === 'customer'
                ? '<text x="50" y="52" font-size="14" font-weight="bold" text-anchor="middle" fill="#000">C</text>'
                : '';
            return `<svg width="80" height="52" viewBox="0 0 100 70" aria-label="外部对象">
                <path d="M 8,32 L 18,22 L 28,32 L 38,22 L 48,32 L 58,22 L 68,32 L 92,32 L 92,66 L 8,66 Z"
                    fill="#fff" stroke="#000" stroke-width="2.5" stroke-linejoin="miter" stroke-linecap="square"/>
                ${mark}
            </svg>`;
        },
        supplier: () => SVG.externalEntity('supplier'),
        customer: () => SVG.externalEntity('customer'),
        inventory: (qty, uid) => `<svg width="40" height="34" viewBox="0 0 100 86">
            <polygon points="50,2 98,84 2,84" fill="#fff59d" stroke="#000" stroke-width="3"/>
            <text x="50" y="${qty ? 58 : 54}" font-size="${qty ? 18 : 30}" font-weight="bold" text-anchor="middle">${esc(qty || 'I')}</text>
        </svg>`,
        materialArrow: (uid) => `<svg width="100%" height="16" viewBox="0 0 100 16" preserveAspectRatio="none">
            <defs><pattern id="bp${uid}" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
                <rect width="3" height="6" fill="#fff"/><rect x="3" width="3" height="6" fill="#1565c0"/>
            </pattern></defs>
            <polygon points="0,3 84,3 84,0 100,8 84,16 84,13 0,13" fill="url(#bp${uid})" stroke="#0d47a1" stroke-width="1"/>
        </svg>`,
        truck: () => `<svg width="56" height="30" viewBox="0 0 100 50">
            <rect x="4" y="12" width="52" height="26" fill="#fff" stroke="#000" stroke-width="2"/>
            <rect x="58" y="18" width="32" height="20" fill="#fff" stroke="#000" stroke-width="2"/>
            <circle cx="20" cy="40" r="7" fill="#fff" stroke="#000" stroke-width="2"/>
            <circle cx="72" cy="40" r="7" fill="#fff" stroke="#000" stroke-width="2"/>
        </svg>`,
        operator: () => `<svg width="18" height="18" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="9" fill="#fff" stroke="#000" stroke-width="1.5"/>
            <path d="M8 16 Q12 8 16 16" fill="none" stroke="#000" stroke-width="1.2"/>
        </svg>`,
        fifo: () => `<svg width="40" height="34" viewBox="0 0 100 70">
            <rect x="6" y="14" width="88" height="48" fill="none" stroke="#000" stroke-width="2"/>
            <line x1="6" y1="36" x2="94" y2="36" stroke="#000" stroke-dasharray="4,3"/>
            <text x="50" y="30" font-size="12" font-weight="bold" text-anchor="middle">FIFO</text>
        </svg>`

    function normHeader(h) {
        return String(h ?? '').trim().toLowerCase().replace(/\s+/g, '');
    }

    function findSheet(workbook, aliases) {
        const names = workbook.SheetNames || [];
        for (const alias of aliases) {
            const hit = names.find((n) => normHeader(n) === normHeader(alias));
            if (hit) return workbook.Sheets[hit];
        }
        return null;
    }

    function sheetRows(sheet) {
        if (!sheet) return [];
        return XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '', raw: false });
    }

    function rowToMap(headers, row) {
        const map = {};
        headers.forEach((h, i) => {
            const key = String(h ?? '').trim();
            if (!key) return;
            map[key] = row[i] ?? '';
        });
        return map;
    }

    function pickField(map, aliases) {
        const keys = Object.keys(map);
        for (const alias of aliases) {
            const na = normHeader(alias);
            const hit = keys.find((k) => normHeader(k) === na);
            if (hit != null && String(map[hit]).trim() !== '') return String(map[hit]).trim();
        }
        return '';
    }

    function parseBool(val) {
        const s = String(val ?? '').trim().toLowerCase();
        return ['1', 'true', 'yes', 'y', '是', '√', '瓶颈'].includes(s);
    }

    function parseList(val) {
        const s = String(val ?? '').trim();
        if (!s) return [];
        return s.split(/[,，;；|/\s]+/).map((x) => x.trim()).filter(Boolean);
    }

    /** 将单元格值解析为分钟：支持纯数字、2d、4h、30min、960~1080 */
    function parseMinutesCell(val) {
        const s = String(val ?? '').trim();
        if (!s) return null;
        if (/^\d+(\.\d+)?$/.test(s)) return Number(s);

        const range = s.match(/^(.+?)\s*[~～\-—]\s*(.+)$/);
        if (range) {
            const a = parseSingleDuration(range[1]);
            const b = parseSingleDuration(range[2]);
            if (a != null && b != null) return { min: Math.min(a, b), max: Math.max(a, b) };
        }
        return parseSingleDuration(s);
    }

    function parseSingleDuration(s) {
        const t = String(s).trim().toLowerCase();
        if (!t) return null;
        if (/^\d+(\.\d+)?$/.test(t)) return Number(t);
        const m = t.match(/^(\d+(?:\.\d+)?)\s*(d|day|days|天|h|hr|hour|hours|小时|min|mins|minute|minutes|分|分钟|m)?$/i);
        if (!m) return Number(t) || null;
        const n = Number(m[1]);
        const u = (m[2] || 'min').toLowerCase();
        if (u === 'd' || u === 'day' || u === 'days' || u === '天') return n * 1440;
        if (u === 'h' || u === 'hr' || u === 'hour' || u === 'hours' || u === '小时') return n * 60;
        return n;
    }

    function parseRate(val) {
        const s = String(val ?? '').trim();
        if (!s) return undefined;
        if (s.endsWith('%')) return Math.min(1, Number(s.slice(0, -1)) / 100);
        const n = Number(s);
        if (!Number.isFinite(n)) return undefined;
        return n > 1 ? n / 100 : n;
    }

    function parseEntitiesSheet(sheet) {
        const rows = sheetRows(sheet);
        if (!rows.length) return {};
        const out = {};
        const h0 = String(rows[0][0] ?? '').trim();
        const isKv = ['配置项', '字段', '键', 'key', 'config'].some((k) => normHeader(h0) === normHeader(k));

        if (isKv && rows.length > 1) {
            rows.slice(1).forEach((row) => {
                const k = String(row[0] ?? '').trim();
                const v = row[1];
                if (!k) return;
                out[k] = v;
            });
        } else {
            const headers = rows[0].map((h) => String(h ?? '').trim());
            const dataRow = rows[1] || [];
            const map = rowToMap(headers, dataRow);
            Object.values(ENTITY_KEYS).flat().forEach((alias) => {
                const v = pickField(map, [alias]);
                if (v) out[alias] = v;
            });
            headers.forEach((h, i) => {
                if (h && dataRow[i] != null && String(dataRow[i]).trim() !== '') out[h] = dataRow[i];
            });
        }

        const get = (...aliases) => {
            for (const a of aliases) {
                const hit = Object.keys(out).find((k) => normHeader(k) === normHeader(a));
                if (hit != null && String(out[hit]).trim() !== '') return String(out[hit]).trim();
            }
            return '';
        };

        return {
            supplier_name: get('supplier_name', '供应商名称', '供应商') || '供应商',
            customer_name: get('customer_name', '客户名称', '客户') || '客户',
            production_control_name: get('production_control_name', '计划部门名称', '生产计划部', '计划部门') || '生产计划部',
            inbound_label: get('inbound_label', '入库标签', '入库') || '原材料入库',
            inbound_wait_minutes: parseMinutesCell(get('inbound_wait_minutes', '首工序等待_分钟', '入库等待_分钟', '首库等待_分钟')),
            outbound_label: get('outbound_label', '出库标签', '出库') || '成品发运'
        };
    }

    function parseProcessesSheet(sheet) {
        const rows = sheetRows(sheet).filter((r) => r.some((c) => String(c ?? '').trim() !== ''));
        if (rows.length < 2) throw new Error('「工序」工作表至少需要表头行和一行数据');

        const headers = rows[0].map((h) => String(h ?? '').trim());
        const processes = [];

        rows.slice(1).forEach((row, idx) => {
            const map = rowToMap(headers, row);
            const id = pickField(map, PROCESS_COLS.id);
            const name = pickField(map, PROCESS_COLS.name);
            if (!id && !name) return;
            if (!id) throw new Error(`工序表第 ${idx + 2} 行缺少工序 ID`);
            if (!name) throw new Error(`工序 ${id} 缺少工序名称`);

            const wait = parseMinutesCell(pickField(map, PROCESS_COLS.wait));
            const setup = parseMinutesCell(pickField(map, PROCESS_COLS.setup));
            let cycle = parseMinutesCell(pickField(map, PROCESS_COLS.cycle));
            const cycleMaxRaw = pickField(map, PROCESS_COLS.cycle_max);
            if (cycleMaxRaw) {
                const cMax = parseMinutesCell(cycleMaxRaw);
                const cMin = typeof cycle === 'number' ? cycle : (cycle?.min ?? 0);
                const cMaxN = typeof cMax === 'number' ? cMax : (cMax?.max ?? cMax?.min);
                if (cMaxN != null && cMin != null && cMaxN !== cMin) cycle = { min: cMin, max: cMaxN };
            }

            const timeline = {};
            if (wait != null) timeline.wait_time_minutes = wait;
            if (setup != null) timeline.setup_time_minutes = setup;
            if (cycle != null) timeline.cycle_time_minutes = cycle;

            const resources = parseList(pickField(map, PROCESS_COLS.resources));
            const operators = pickField(map, PROCESS_COLS.operators);
            const availability = pickField(map, PROCESS_COLS.availability);
            const performance = pickField(map, PROCESS_COLS.performance);
            const yld = pickField(map, PROCESS_COLS.yield);
            const ie = {};
            if (operators) ie.operators = Number(operators) || 1;
            const ar = parseRate(availability);
            if (ar != null) ie.availability_rate = ar;
            const pr = parseRate(performance);
            if (pr != null) ie.performance_rate = pr;
            const qr = parseRate(yld);
            if (qr != null) ie.quality_yield = qr;

            const proc = {
                id,
                name,
                predecessors: parseList(pickField(map, PROCESS_COLS.predecessors)),
                timeline,
                ie_data: ie
            };
            if (resources.length) proc.resources = resources;
            if (parseBool(pickField(map, PROCESS_COLS.bottleneck))) {
                proc.is_bottleneck = true;
                const reason = pickField(map, PROCESS_COLS.bottleneck_reason);
                if (reason) proc.bottleneck_reason = reason;
            }
            processes.push(proc);
        });

        if (!processes.length) throw new Error('「工序」工作表未解析到有效工序行');
        return processes;
    }

    function parseFlowsSheet(sheet) {
        const rows = sheetRows(sheet).filter((r) => r.some((c) => String(c ?? '').trim() !== ''));
        if (rows.length < 2) return [];
        const headers = rows[0].map((h) => String(h ?? '').trim());
        const flows = [];

        rows.slice(1).forEach((row) => {
            const map = rowToMap(headers, row);
            const from = pickField(map, FLOW_COLS.from);
            const to = pickField(map, FLOW_COLS.to);
            if (!from || !to) return;
            flows.push({
                from,
                to,
                type: pickField(map, FLOW_COLS.type) || 'electronic_info',
                content: pickField(map, FLOW_COLS.content) || undefined
            });
        });
        return flows;
    }

    function excelWorkbookToMacroJson(workbook) {
        const procSheet = findSheet(workbook, EXCEL_SHEETS.processes);
        if (!procSheet) throw new Error('未找到「工序」工作表（也接受 processes 命名）');

        const entSheet = findSheet(workbook, EXCEL_SHEETS.entities);
        const flowSheet = findSheet(workbook, EXCEL_SHEETS.flows);
        const ent = entSheet ? parseEntitiesSheet(entSheet) : parseEntitiesSheet(null);
        const processes = parseProcessesSheet(procSheet);
        const macro_flows = flowSheet ? parseFlowsSheet(flowSheet) : [];

        const raw = {
            macro_entities: {
                supplier: { name: ent.supplier_name },
                customer: { name: ent.customer_name },
                production_control: { name: ent.production_control_name }
            },
            macro_flows,
            processes
        };

        if (ent.inbound_label || ent.inbound_wait_minutes != null) {
            raw.inbound = { label: ent.inbound_label };
            if (ent.inbound_wait_minutes != null) {
                const w = ent.inbound_wait_minutes;
                const min = typeof w === 'object' ? w.min : w;
                raw.inbound.wait = minutesToDuration(min);
            }
        }
        if (ent.outbound_label) raw.outbound = { label: ent.outbound_label };

        return raw;
    }

    function getInboundWaitMinutes(d) {
        if (d.inbound?.wait_time_minutes != null) return d.inbound.wait_time_minutes;
        if (d.inbound?.wait) {
            const parsed = parseMinutesCell(d.inbound.wait);
            if (parsed != null) return typeof parsed === 'object' ? parsed.min : parsed;
        }
        const root = (d.processes || []).find((p) => !(p.predecessors || []).length);
        return root?.timeline?.wait_time_minutes ?? '';
    }

    /** 由 Macro JSON 构建 Excel 工作簿（与导入模板结构一致，可双向转换） */
    function buildWorkbookFromMacroJson(d, { source = 'template' } = {}) {
        const ent = d.macro_entities || {};
        const wb = XLSX.utils.book_new();
        const srcLabel = source === 'natural_language' ? '自然语言 AI 生成' : '内置模板';

        const readme = [
            ['VSM Macro Excel'],
            ['来源', srcLabel],
            [''],
            ['工作表', '用途'],
            ['外部实体', '供应商 / 客户 / 计划部门 / 入库出库'],
            ['工序', '工序列表；前序多个用英文逗号，如 P02,P03'],
            ['信息流', '起点/终点：customer、production_control、supplier'],
            [''],
            ['说明', '本文件可由 JSON 导出，也可导入工具还原为 JSON 并渲染']
        ];
        XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(readme), '说明');

        const entities = [
            ['配置项', '值', '说明'],
            ['supplier_name', ent.supplier?.name || '供应商', '供应商名称'],
            ['customer_name', ent.customer?.name || '客户', '客户名称'],
            ['production_control_name', ent.production_control?.name || '生产计划部', '计划部门名称'],
            ['inbound_label', d.inbound?.label || '原材料入库', '物料流左侧入库标签'],
            ['inbound_wait_minutes', getInboundWaitMinutes(d), '首工序前等待（分钟）'],
            ['outbound_label', d.outbound?.label || '成品发运', '物料流右侧出库标签']
        ];
        XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(entities), '外部实体');

        const procHeader = [
            '工序ID', '工序名称', '前序工序', '资源', '等待_分钟', '换型_分钟',
            '加工_分钟', '加工_分钟_最大', '人数', '稼动率', '性能率', '合格率', 'OEE', '瓶颈', '瓶颈说明'
        ];
        const procRows = [procHeader];
        (d.processes || []).forEach((p) => {
            const tl = p.timeline || {};
            const ie = p.ie_data || {};
            const cycle = tl.cycle_time_minutes;
            let cycleMin = '';
            let cycleMax = '';
            if (cycle && typeof cycle === 'object') {
                cycleMin = cycle.min ?? '';
                cycleMax = cycle.max ?? '';
            } else if (cycle != null) {
                cycleMin = cycle;
            }
            const a = ie.availability_rate != null ? Number(ie.availability_rate) : null;
            const perf = ie.performance_rate != null ? Number(ie.performance_rate) : 1;
            const q = ie.quality_yield != null ? Number(ie.quality_yield) : null;
            const oee = (a != null && q != null && Number.isFinite(a) && Number.isFinite(q) && Number.isFinite(perf))
                ? a * perf * q
                : '';
            procRows.push([
                p.id,
                p.name,
                (p.predecessors || []).join(','),
                (p.resources || []).join(','),
                tl.wait_time_minutes ?? '',
                tl.setup_time_minutes ?? '',
                cycleMin,
                cycleMax,
                ie.operators ?? '',
                ie.availability_rate ?? '',
                ie.performance_rate ?? '',
                ie.quality_yield ?? '',
                oee,
                p.is_bottleneck ? '是' : '',
                p.bottleneck_reason || ''
            ]);
        });
        XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(procRows), '工序');

        const flowRows = [
            ['起点', '终点', '类型', '内容'],
            ...(d.macro_flows || []).map((f) => [f.from, f.to, f.type || 'electronic_info', f.content || ''])
        ];
        XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(flowRows), '信息流');

        return wb;
    }

    function downloadExcelFromMacroJson(data, filename, { source } = {}) {
        if (typeof XLSX === 'undefined') {
            alert('SheetJS 未加载，请检查网络后刷新页面');
            return null;
        }
        const name = filename || 'VSM_Macro.xlsx';
        const wb = buildWorkbookFromMacroJson(data, {
            source: source || (name.includes('自然语言') ? 'natural_language' : 'export')
        });
        XLSX.writeFile(wb, name);
        return name;
    }

    function showExcelStatus(_msg) { /* 内部状态提示已关闭，避免干扰界面 */ }

    function importExcelFile(file) {
        const input = document.getElementById('excel-file');
        if (!file) return;
        if (typeof XLSX === 'undefined') {
            alert('SheetJS 未加载，请检查网络后刷新页面');
            if (input) input.value = '';
            return;
        }

        const reader = new FileReader();
        reader.onload = (e) => {
            try {
                const wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
                const macroJson = excelWorkbookToMacroJson(wb);
                document.getElementById('json-input').value = JSON.stringify(macroJson, null, 2);
                showExcelStatus(`已导入：${file.name}（${macroJson.processes.length} 道工序，${(macroJson.macro_flows || []).length} 条信息流）`);
                render();
            } catch (err) {
                showExcelStatus('');
                document.getElementById('error').textContent = `Excel 导入失败：${err.message}`;
                document.getElementById('error').style.display = 'block';
            } finally {
                if (input) input.value = '';
            }
        };
        reader.onerror = () => {
            showExcelStatus('');
            document.getElementById('error').textContent = '读取 Excel 文件失败';
            document.getElementById('error').style.display = 'block';
            if (input) input.value = '';
        };
        reader.readAsArrayBuffer(file);
    }

    /* ========== 自然语言 → JSON ========== */

    const NL_PROVIDER_PRESETS = {
        deepseek: { baseUrl: 'https://api.deepseek.com', model: 'deepseek-chat' },
        openai: { baseUrl: 'https://api.openai.com/v1', model: 'gpt-4o-mini' },

    const NL_EXAMPLE_TEXT = `某汽轮机厂叶片加工价值流，4 道工序：

    function extractJsonFromModelText(text) {
        const raw = String(text ?? '').trim();
        if (!raw) throw new Error('模型返回为空');
        const fenced = raw.match(/```(?:json)?\s*([\s\S]*?)```/i);
        const candidate = (fenced ? fenced[1] : raw).trim();
        const start = candidate.indexOf('{');
        const end = candidate.lastIndexOf('}');
        if (start < 0 || end <= start) throw new Error('未在模型回复中找到 JSON 对象');
        return JSON.parse(candidate.slice(start, end + 1));
    }

    function validateGeneratedMacroJson(raw) {
        if (!raw || typeof raw !== 'object') throw new Error('生成结果不是 JSON 对象');
        if (!Array.isArray(raw.processes) || !raw.processes.length) {
            throw new Error('生成结果缺少 processes 或工序为空');
        }
        raw.processes.forEach((p, i) => {
            if (!p?.id) throw new Error(`第 ${i + 1} 道工序缺少 id`);
            if (!p?.name) throw new Error(`工序 ${p.id} 缺少 name`);
            if (!p.timeline) p.timeline = {};
        });
        if (!raw.macro_entities) {
            raw.macro_entities = {
                supplier: { name: '供应商' },
                customer: { name: '客户' },
                production_control: { name: '生产计划部' }
            };
        }
        if (!raw.macro_flows) raw.macro_flows = [];
        normalizeInput(raw);
        return raw;
    }

    async function generateJsonFromNaturalLanguage() {
        const btn = document.getElementById('btn-nl-generate');
        const err = document.getElementById('error');
        const desc = document.getElementById('nl-input').value.trim();
        const apiKey = document.getElementById('nl-api-key').value.trim();
        let baseUrl = document.getElementById('nl-base-url').value.trim().replace(/\/+$/, '');
        const model = document.getElementById('nl-model').value.trim();

        saveNlSettings();
        err.style.display = 'none';
        showExcelStatus('');

        if (!desc) {
            err.textContent = '请先输入自然语言描述';
            err.style.display = 'block';
            return;
        }
        if (!apiKey) {
            err.textContent = '请填写 API Key（DeepSeek / OpenAI 等 OpenAI 兼容接口）';
            err.style.display = 'block';
            return;
        }
        if (!baseUrl || !model) {
            err.textContent = '请填写 API Base URL 和模型名称';
            err.style.display = 'block';
            return;
        }

        const url = `${baseUrl}/chat/completions`;
        btn.disabled = true;
        btn.textContent = '生成中…';

        try {
            const resp = await fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    Authorization: `Bearer ${apiKey}`
                },
                body: JSON.stringify({
                    model,
                    temperature: 0.2,
                    messages: [
                        { role: 'system', content: buildNlSystemPrompt() },
                        { role: 'user', content: desc }
                    ]
                })
            });

            const body = await resp.json().catch(() => ({}));
            if (!resp.ok) {
                const msg = body.error?.message || body.message || resp.statusText;
                throw new Error(`API 请求失败 (${resp.status})：${msg}`);
            }

            const content = body.choices?.[0]?.message?.content;
            const raw = extractJsonFromModelText(content);
            validateGeneratedMacroJson(raw);

            document.getElementById('json-input').value = JSON.stringify(raw, null, 2);
            const excelName = downloadExcelFromMacroJson(raw, 'VSM_自然语言生成.xlsx', { source: 'natural_language' });
            switchInputMode('json');
            showExcelStatus(
                `已生成：${excelName} + JSON（${raw.processes.length} 道工序，`
                + `${(raw.macro_flows || []).length} 条信息流）· Excel 已下载，请核对 JSON 后渲染`
            );
            render();
        } catch (e) {
            err.textContent = e.message || String(e);
            err.style.display = 'block';
        } finally {
            btn.disabled = false;
            btn.textContent = '生成 Excel + JSON 并渲染';
        }
    }

    function buildColumns(data) {
        const cols = [];
        const uid = Date.now();
        const procs = data.processes || [];
        cols.push({ type: 'truck-in', id: 'INBOUND', label: data.inbound?.label || '入库', wait: '' });

        procs.forEach((p, i) => {
            const prev = i > 0 ? procs[i - 1] : null;
            const nl = i === 0
                ? (data.first_inventory || p.next_link || { type: 'inventory', quantity: '1' })
                : (prev.next_link || { type: 'inventory', quantity: '1' });
            const invType = nl.type === 'fifo' ? 'fifo' : 'inventory';
            const wait = i === 0
                ? (data.inbound?.wait ?? p.timeline?.wait ?? '')
                : (prev.timeline?.wait ?? '');
            cols.push({
                type: invType,
                id: `INV-${i}`,
                quantity: nl.quantity ?? 'I',
                wait: String(wait)
            });
            cols.push({
                type: 'process',
                id: p.id,
                process: p,
                cycle: p.timeline?.cycle ?? p.data?.['C/T'] ?? ''
            });
        });

        cols.push({ type: 'truck-out', id: 'OUTBOUND', label: data.outbound?.label || '出库' });
        return { cols, uid };
    }

    function colWidth(col) {
        if (col.type === 'truck-in' || col.type === 'truck-out') return LAYOUT.truck;
        if (col.type === 'process') return LAYOUT.process;
        return LAYOUT.link;
    }

    function colClass(col) {
        if (col.type === 'truck-in' || col.type === 'truck-out') return 'col-truck';
        if (col.type === 'process') return 'col-process';
        return 'col-link';
    }

    function getLayoutAnchor(id, layout, side) {
        const pos = layout[id];
        if (!pos) return { x: 0, y: 0 };
        if (side === 'right') return { x: pos.xRight, y: pos.yFlow };
        if (side === 'left') return { x: pos.xLeft, y: pos.yFlow };
        return { x: pos.xCenter, y: pos.yFlow };
    }

    function linkBusX(fromId, toId, layout) {
        const a = getLayoutAnchor(fromId, layout, 'right');
        const b = getLayoutAnchor(toId, layout, 'left');
        return a.x + (b.x - a.x) / 2;
    }

    /** 与线性模式 .mat-inv-row 对齐：三角在 push 箭头正下方居中 */
    const MAT_GRAPH = { arrowH: 16, invGap: 8, waitOffset: 10 };

    /**
     * 构建物料路由：水平段用标准 VSM chevron，垂直段用实线母线。
     */
    function buildMaterialRoutes(graph, layout) {
        const segments = [];
        const labels = [];
        const forkTrunkDone = new Set();
        const mergeTrunkDone = new Set();

        function addHSeg(x1, x2, y, withHead) {
            if (x2 - x1 < 2) return;
            segments.push({ kind: 'h', x1, x2, y, withHead });
        }

        function addVSeg(x1, y1, x2, y2) {
            if (Math.abs(y2 - y1) < 2) return;
            segments.push({ kind: 'v', x1, y1, x2, y2 });
        }

        /** 在制品三角：水平居中于 push 箭头，位于箭头下缘 + invGap（同线性 VSM） */
        function addLabelOnArrow(edge, x1, x2, y) {
            labels.push({
                edge,
                x: (x1 + x2) / 2,
                invTop: y + MAT_GRAPH.arrowH / 2 + MAT_GRAPH.invGap,
                waitTop: y - MAT_GRAPH.arrowH / 2 - MAT_GRAPH.waitOffset
            });
        }

        graph.edges.forEach((edge) => {
            const { from, to } = edge;
            const a = getLayoutAnchor(from, layout, 'right');
            const b = getLayoutAnchor(to, layout, 'left');
            const endX = b.x - 2;

            if (to === '__OUTBOUND__') {
                addHSeg(a.x, endX, a.y, true);
                return;
            }

            const busX = linkBusX(from, to, layout);
            const succs = graph.edges.filter((e) => e.from === from && e.to !== '__OUTBOUND__');
            const preds = graph.edges.filter((e) => e.to === to && e.from !== '__INBOUND__');
            const isFork = succs.length > 1;
            const isMerge = preds.length > 1;

            if (Math.abs(a.y - b.y) < 2 && !isFork && !isMerge) {
                addHSeg(a.x, endX, a.y, true);
                addLabelOnArrow(edge, a.x, endX, a.y);
                return;
            }

            if (isFork) {
                if (!forkTrunkDone.has(from)) {
                    addHSeg(a.x, busX, a.y, false);
                    forkTrunkDone.add(from);
                }
                if (Math.abs(a.y - b.y) >= 2) {
                    addVSeg(busX, a.y, busX, b.y);
                }
                addHSeg(busX, endX, b.y, true);
                addLabelOnArrow(edge, busX, endX, b.y);
                return;
            }

            if (isMerge) {
                addHSeg(a.x, busX, a.y, false);
                if (!mergeTrunkDone.has(to)) {
                    const predYs = preds.map((e) => getLayoutAnchor(e.from, layout, 'right').y);
                    const vTop = Math.min(...predYs);
                    const vBot = Math.max(...predYs, b.y);
                    addVSeg(busX, vTop, busX, vBot);
                    addHSeg(busX, endX, b.y, true);
                    const labelEdge = preds.find((e) => e.wait) || preds[0];
                    addLabelOnArrow(labelEdge, busX, endX, b.y);
                    mergeTrunkDone.add(to);
                }
                return;
            }

            addHSeg(a.x, busX, a.y, false);
            if (Math.abs(a.y - b.y) >= 2) {
                addVSeg(busX, a.y, busX, b.y);
            }
            addHSeg(busX, endX, b.y, true);
            addLabelOnArrow(edge, busX, endX, b.y);
        });

        return { segments, labels };
    }

    /** 标准 VSM 物料流 chevron（与 SVG.materialArrow 同形，可指定宽度与是否带箭头尖） */
    function renderMaterialChevron(x1, x2, y, uid, withHead) {
        const w = x2 - x1;
        if (w < 2) return '';
        const h = 16;
        const y0 = y - h / 2;
        const pid = `bp${uid}`;
        const sx = w / 100;

        if (!withHead) {
            return `<rect x="${x1}" y="${y0 + 2.5}" width="${w}" height="11"
                fill="url(#${pid})" stroke="#0d47a1" stroke-width="1"/>`;
        }

        const p = (px, py) => `${x1 + px * sx},${y0 + py}`;
        const points = [
            p(0, 3), p(84, 3), p(84, 0), p(100, 8), p(84, 16), p(84, 13), p(0, 13)
        ].join(' ');
        return `<polygon points="${points}" fill="url(#${pid})" stroke="#0d47a1" stroke-width="1"/>`;
    }

    function renderProcessNodeHtml(p) {
        const bn = p.is_bottleneck ? ' bottleneck' : '';
        let html = `<div class="mat-process${bn}"><span class="vsm-edit-name" data-process-id="${escAttr(p.id)}" title="点击编辑名称">${esc(p.name)}</span>`;
        if (p.operators) html += `<span class="mat-operator">${SVG.operator()}</span>`;
        html += '</div>';
        if (p.data) {
            html += '<table class="mat-data">';
            for (const [k, v] of Object.entries(p.data)) {
                if (k === 'OEE') {
                    html += `<tr><td>${esc(k)}</td><td title="由稼动率×性能率×合格率计算">${esc(v)}</td></tr>`;
                } else {
                    html += `<tr><td>${esc(k)}</td><td class="vsm-edit-data" data-process-id="${escAttr(p.id)}" data-field="${escAttr(k)}" title="点击编辑">${esc(v)}</td></tr>`;
                }
            }
            html += '</table>';
        }
        return html;
    }

    /** 步骤 3：分叉/合流物料流（使用 graphLayout 坐标） */
    function renderMaterialGraph(data, graphLayout, uid) {
        const { layout, totalW, totalH } = graphLayout;
        const graph = data.graph;
        const routes = buildMaterialRoutes(graph, layout);
        let html = `<div class="mat-canvas" style="width:${totalW}px;height:${totalH}px">`;

        let svgInner = `<defs>
            <pattern id="bp${uid}" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
                <rect width="3" height="6" fill="#fff"/><rect x="3" width="3" height="6" fill="#1565c0"/>
            </pattern>
        </defs>`;

        routes.segments.forEach((seg) => {
            if (seg.kind === 'v') {
                svgInner += `<line x1="${seg.x1}" y1="${seg.y1}" x2="${seg.x2}" y2="${seg.y2}"
                    stroke="#0d47a1" stroke-width="2.5" stroke-linecap="square"/>`;
            } else {
                svgInner += renderMaterialChevron(seg.x1, seg.x2, seg.y, uid, seg.withHead);
            }
        });

        html += `<svg class="mat-flow-svg" width="${totalW}" height="${totalH}">${svgInner}</svg>`;

        const inPos = layout.__INBOUND__;
        html += `<div class="mat-graph-truck" style="left:0;top:${inPos.yFlow}px;width:${LAYOUT.truck}px">
            ${SVG.truck()}<span class="lbl vsm-edit-flow" data-flow="inbound" title="点击编辑标签">${esc(data.inbound?.label || '入库')}</span>
        </div>`;

        const outPos = layout.__OUTBOUND__;
        html += `<div class="mat-graph-truck" style="left:${outPos.xLeft}px;top:${outPos.yFlow}px;width:${LAYOUT.truck}px">
            ${SVG.truck()}<span class="lbl vsm-edit-flow" data-flow="outbound" title="点击编辑标签">${esc(data.outbound?.label || '出库')}</span>
        </div>`;

        graph.processIds.forEach((id) => {
            const pos = layout[id];
            const p = data.processById[id];
            if (!p || !pos) return;
            const top = pos.yFlow - 20;
            html += `<div class="mat-graph-node" style="left:${pos.xLeft}px;top:${top}px">
                ${renderProcessNodeHtml(p)}
            </div>`;
        });

        routes.labels.forEach(({ edge, x, invTop, waitTop }) => {
            const waitStr = minutesToDuration(edge.wait);
            if (waitStr && waitStr !== '0') {
                html += `<div class="mat-edge-wait" style="left:${x}px;top:${waitTop}px">${esc(waitStr)}</div>`;
            }
            html += `<div class="mat-edge-inv" style="left:${x}px;top:${invTop}px">
                ${SVG.inventory('I', uid)}
            </div>`;
        });

        html += '</div>';
        return html;
    }

    function renderMaterialLinear(cols, widths, uid) {
        let html = '<div class="vsm-grid">';
        cols.forEach((col, i) => {
            const w = widths[i];
            html += `<div class="vsm-col ${colClass(col)}" style="width:${w}px">`;
            html += '<div class="mat-band">';
            if (col.type === 'truck-in') {
                html += `<div class="mat-truck">${SVG.truck()}<span class="lbl vsm-edit-flow" data-flow="inbound" title="点击编辑标签">${esc(col.label)}</span></div>`;
            } else if (col.type === 'truck-out') {
                html += `<div class="mat-arrow-row">${SVG.materialArrow(uid)}</div>`;
                html += `<div class="mat-truck">${SVG.truck()}<span class="lbl vsm-edit-flow" data-flow="outbound" title="点击编辑标签">${esc(col.label)}</span></div>`;
            } else if (col.type === 'inventory' || col.type === 'fifo') {
                html += `<div class="mat-arrow-row">${SVG.materialArrow(uid)}</div>`;
                html += `<div class="mat-inv-row">${col.type === 'fifo' ? SVG.fifo() : SVG.inventory(col.quantity, uid)}
                    <span class="inv-qty-below">${esc(col.quantity ?? '')}</span></div>`;
            } else if (col.type === 'process') {
                const p = col.process;
                html += renderProcessNodeHtml(p);
            }
            html += '</div></div>';
        });
        html += '</div>';
        return html;
    }

    function renderMap(data) {

        const totalW = widths.reduce((a, b) => a + b, 0);
        let html = '<div class="vsm-template">';

        const matStart = widths[0];

        html += `<div class="info-stage" style="width:${totalW}px;height:${INFO.stageH}px;--info-grid-top:${INFO.gridTop}px;--info-pc-top:${INFO.pcTop}px">`;
        html += '<div class="vsm-grid" id="info-grid">';
        cols.forEach((col, i) => {
